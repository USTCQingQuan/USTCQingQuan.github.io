<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="拾学集:中科大同学的权益服务与学习资源站。权益服务汇总校内各反馈渠道与部门联系电话,遇到问题知道找谁;学习资源精选 186 个网络资源与 1580 份历年试卷。" />
<title>拾学集 · 中科大学生资源与权益服务</title>
<style>
  :root {
    --bg: #f7f4ec;
    --card: #ffffff;
    --ink: #22302b;
    --muted: #71827b;
    --primary: #175e4c;
    --primary-deep: #0e4437;
    --accent: #e8b04b;
    --border: #e8e2d3;
    --c-kecheng: #2e7d5b;
    --c-shipin: #b4552d;
    --c-biancheng: #35579b;
    --c-xueshu: #6d4c9f;
    --c-xiaonei: #0e7490;
    --c-xiaolv: #a16207;
    --c-jingsai: #b91c1c;
    --c-xiaoyuan: #be185d;
    --c-yingyu: #4d7c0f;
    --c-ai: #1d4ed8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

  /* ===== Hero ===== */
  .hero {
    position: relative; overflow: hidden;
    background:
      radial-gradient(1100px 420px at 85% -10%, rgba(232, 176, 75, 0.28), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(46, 125, 91, 0.35), transparent 55%),
      linear-gradient(135deg, #103c31 0%, #175e4c 55%, #1d6b57 100%);
    color: #f3f0e6;
    padding: 72px 0 88px;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, #000 30%, transparent 75%);
  }
  .hero .wrap { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: 2px; color: #cfe3d9;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    padding: 6px 16px; margin-bottom: 22px; backdrop-filter: blur(4px);
  }
  .hero-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .hero h1 {
    font-size: clamp(38px, 6vw, 60px); font-weight: 800; letter-spacing: 4px; line-height: 1.15;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p.sub b { color: #fff; font-weight: 600; }
  .hero p.sub {
    margin-top: 16px; max-width: 560px; font-size: 16px; color: #c6d8cf;
  }
  .hero-stats { display: flex; gap: 36px; margin-left: auto; padding-bottom: 6px; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 30px; font-weight: 800; color: #fff; }
  .stat span { font-size: 13px; color: #b9cec3; letter-spacing: 1px; }

  /* ===== Sticky toolbar ===== */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(247, 244, 236, 0.88); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 6px 24px rgba(34, 48, 43, 0.05);
    padding: 14px 0;
  }
  .toolbar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search {
    position: relative; flex: 1 1 240px; max-width: 340px;
  }
  .search svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; stroke: var(--muted);
  }
  .search input {
    width: 100%; padding: 10px 16px 10px 38px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--card); color: var(--ink); outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23, 94, 76, 0.12); }
  .chip {
    padding: 8px 18px; border-radius: 999px; font-size: 14px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--ink); cursor: pointer; transition: all .18s;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
  .chip.active {
    background: var(--primary); border-color: var(--primary); color: #fff;
    box-shadow: 0 4px 14px rgba(23, 94, 76, 0.3);
  }
  .free-toggle {
    margin-left: auto; font-size: 14px; color: var(--muted);
    display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
  }
  .free-toggle input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }

  /* ===== Cards ===== */
  main { padding: 36px 0 56px; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    position: relative; display: block; overflow: hidden;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px 22px 18px;
    text-decoration: none; color: inherit;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    animation: rise .5s ease both;
  }
  .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, var(--cat-color, var(--primary)), transparent 80%);
    opacity: 0; transition: opacity .22s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(23, 94, 76, 0.35);
    box-shadow: 0 16px 40px rgba(34, 48, 43, 0.12);
  }
  .card:hover::after { opacity: 1; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-head { display: flex; align-items: center; gap: 13px; }
  .card-icon {
    width: 46px; height: 46px; flex: none; border-radius: 13px;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: color-mix(in srgb, var(--cat-color, var(--primary)) 12%, #fff);
    border: 1px solid color-mix(in srgb, var(--cat-color, var(--primary)) 22%, #fff);
  }
  .card-name { font-size: 16.5px; font-weight: 700; letter-spacing: .3px; }
  .card-jump {
    margin-left: auto; flex: none; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; border: 1px solid var(--border);
    transition: all .2s;
  }
  .card:hover .card-jump {
    background: var(--primary); border-color: var(--primary); color: #fff;
    transform: rotate(45deg);
  }
  .card-desc { margin-top: 12px; font-size: 13.5px; color: var(--muted); min-height: 44px; }
  .card-foot { margin-top: 14px; display: flex; gap: 8px; }
  .badge { font-size: 12px; padding: 3px 11px; border-radius: 999px; letter-spacing: .3px; }
  .badge.cat {
    color: var(--cat-color, var(--primary));
    background: color-mix(in srgb, var(--cat-color, var(--primary)) 10%, #fff);
  }
  .badge.free { background: #e2f0e8; color: #17603f; }
  .badge.paid { background: #f8ecd8; color: #96660f; }
  .empty { text-align: center; color: var(--muted); padding: 72px 0; font-size: 15px; }

  /* 搜索结果计数条：告诉用户"筛完剩几条"以及"为什么这些条目命中" */
  .result-bar {
    margin: 0 0 14px; font-size: 13.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .result-bar b { color: var(--primary); font-size: 15px; }
  .result-bar .rb-kw {
    background: #fdf3d7; color: #8a6100; padding: 1px 7px; border-radius: 5px;
    font-weight: 600;
  }
  .result-bar .rb-clear {
    margin-left: auto; font-size: 12.5px; color: var(--muted);
    background: none; border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 11px; cursor: pointer;
  }
  .result-bar .rb-clear:hover { border-color: var(--primary); color: var(--primary); }
  /* 命中关键词高亮 */
  mark.hl { background: #fdf3d7; color: #8a6100; padding: 0 2px; border-radius: 3px; font-weight: 600; }
  /* 匹配位置提示 */
  .card-why { font-size: 11.5px; color: #a08a5a; margin-top: 6px; }
  /* 无结果时的标签建议 */
  .empty .eh-tip { display: block; margin-top: 10px; font-size: 13px; }
  .empty .eh-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .empty .eh-tag {
    font-size: 13px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; color: var(--primary);
  }
  .empty .eh-tag:hover { border-color: var(--primary); background: #f2f8f5; }

  /* ---------- 历年试卷（列表视图） ---------- */
  /* 1580 条用卡片太重，这里用紧凑列表：一行一条，便于按年份快速扫读 */
  .ex-bar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    padding: 14px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .ex-bar input[type="search"] {
    flex: 1 1 260px; min-width: 180px; padding: 9px 14px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 999px; background: #fff;
    font-family: inherit; color: var(--text);
  }
  .ex-bar input[type="search"]:focus { outline: none; border-color: var(--primary); }
  .ex-bar select {
    padding: 9px 12px; font-size: 13.5px; border: 1px solid var(--border);
    border-radius: 999px; background: #fff; color: var(--text); font-family: inherit;
    max-width: 210px;
  }
  .ex-bar .ex-sort {
    padding: 9px 14px; font-size: 13.5px; border: 1px solid var(--border);
    border-radius: 999px; background: #fff; cursor: pointer; color: var(--text);
    font-family: inherit;
  }
  .ex-bar .ex-sort:hover { border-color: var(--primary); color: var(--primary); }
  .ex-count { font-size: 13px; color: var(--muted); padding: 10px 0 6px; }
  .ex-count b { color: var(--primary); font-size: 14px; }

  .ex-list { display: flex; flex-direction: column; }
  .ex-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border-bottom: 1px solid #f0f0ec; font-size: 14px;
  }
  .ex-row:hover { background: #fafaf7; }
  .ex-row .ex-year {
    flex: 0 0 76px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums;
  }
  .ex-row .ex-course { flex: 0 0 200px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-row .ex-type { flex: 0 0 52px; color: var(--muted); font-size: 13px; }
  .ex-row .ex-teacher { flex: 0 0 82px; color: var(--muted); font-size: 13px; }
  .ex-row .ex-name { flex: 1 1 auto; color: #6b6b62; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-row .ex-go {
    flex: 0 0 auto; font-size: 13px; padding: 5px 13px; border-radius: 999px;
    border: 1px solid var(--border); background: #fff; color: var(--primary);
    text-decoration: none; white-space: nowrap;
  }
  .ex-row .ex-go:hover { border-color: var(--primary); background: #f2f8f5; }
  .ex-row .ex-none { flex: 0 0 auto; font-size: 12px; color: #b0b0a6; white-space: nowrap; }
  .ex-row .ex-mirror { flex: 0 0 auto; font-size: 11px; color: #17603f; background: #e2f0e8; padding: 2px 8px; border-radius: 999px; }
  @media (max-width: 720px) {
    .ex-row { flex-wrap: wrap; gap: 6px 10px; }
    .ex-row .ex-course { flex: 1 1 100%; }
    .ex-row .ex-name { display: none; }
    .ex-row .ex-year, .ex-row .ex-type, .ex-row .ex-teacher { flex: 0 0 auto; }
  }

  /* ---------- 权益反馈 ---------- */
  /* 用途：把校内各反馈渠道汇总成一张清单，学生遇到问题知道找谁。
     与资源卡片不同，这里强调「按场景分组」——出问题的人先想的是
     "我这是哪类问题"，而不是"哪个部门管"。 */
  .rt-intro {
    padding: 18px 20px; background: #f2f8f5; border: 1px solid #d8e8e0;
    border-radius: 14px; margin: 4px 0 22px; font-size: 14px; line-height: 1.7; color: #3d4b45;
  }
  .rt-intro b { color: var(--primary); }

  .rt-cat { margin-bottom: 26px; }
  .rt-cat h3 {
    font-size: 16px; font-weight: 700; color: var(--primary);
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;
  }
  .rt-cat h3 .rt-cat-desc { font-size: 12.5px; font-weight: 400; color: var(--muted); }
  .rt-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 10px; }
  .rt-item {
    border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px;
    background: #fff; display: flex; flex-direction: column; gap: 6px;
  }
  .rt-item.todo { background: #faf9f5; border-style: dashed; }
  .rt-item .rt-name { font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .rt-item .rt-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; flex: 1; }
  .rt-item .rt-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .rt-item .rt-go {
    font-size: 13px; padding: 5px 14px; border-radius: 999px; text-decoration: none;
    border: 1px solid var(--border); color: var(--primary); background: #fff; white-space: nowrap;
  }
  .rt-item .rt-go:hover { border-color: var(--primary); background: #f2f8f5; }
  .rt-item .rt-wait { font-size: 12px; color: #b0b0a6; }
  .rt-item .rt-val {
    font-size: 12px; color: #5a6b62; background: #f4f6f4; border-radius: 6px;
    padding: 2px 7px; font-family: ui-monospace, Consolas, monospace;
    max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rt-item .rt-flex { flex: 1; }
  .rt-item .rt-wx { font-size: 12px; color: var(--primary-deep); }
  .rt-item .rt-ok { font-size: 11px; color: #17603f; }
  .rt-item .rt-ok::before { content: "●"; font-size: 8px; margin-right: 4px; vertical-align: middle; }

  /* 权益服务工作宣传（内容待补，先占位） */
  .rt-promo {
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    margin-top: 8px; background: #fff;
  }
  .rt-promo-head {
    padding: 16px 20px; background: linear-gradient(135deg, #175e4c, #1d7a60); color: #fff;
  }
  .rt-promo-head h3 { font-size: 16px; font-weight: 700; }
  .rt-promo-head p { font-size: 12.5px; color: #cfe3da; margin-top: 4px; }
  .rt-promo-body { padding: 20px; }
  .rt-promo-empty {
    text-align: center; padding: 26px 16px; color: var(--muted); font-size: 13.5px; line-height: 1.8;
  }
  .rt-promo-empty b { color: var(--primary); }

  /* 「服务工作」页里的待填栏目 */
  .wk-block {
    border: 1px dashed var(--border); border-radius: 12px;
    padding: 14px 16px 14px; margin-bottom: 10px; background: #faf9f5;
    position: relative;
  }
  .wk-block h4 { font-size: 14.5px; font-weight: 700; color: var(--ink); margin-bottom: 5px; }
  .wk-block p { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .wk-block .wk-soon {
    position: absolute; top: 13px; right: 14px;
    font-size: 11px; color: #9a8f7d; background: #f0ece2;
    padding: 2px 9px; border-radius: 999px;
  }
  .wk-jump { text-align: center; margin-top: 18px; }
  .wk-jump .sub-btn { border: 1px solid var(--border); background: #fff; padding: 8px 18px; font-size: 13.5px; }
  .wk-jump .sub-btn:hover { border-color: var(--primary); background: #f2f8f5; }
  @media (max-width: 640px) {
    .wk-block .wk-soon { position: static; display: inline-block; margin-top: 8px; }
  }

  /* ---------- 首页：权益宣传工作 + 两个入口 ---------- */
  .home-wrap { padding-top: 8px; }

  /* 宣传区 */
  .promo {
    border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
    background: #fff; margin-bottom: 26px;
  }
  .promo-head {
    padding: 22px 26px;
    background: linear-gradient(135deg, #175e4c 0%, #1d7a60 60%, #23896c 100%);
    color: #fff;
  }
  .promo-head h2 { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
  .promo-head p { font-size: 13px; color: #cfe3da; margin-top: 5px; }
  .promo-src {
    display: inline-block; margin-left: 10px; vertical-align: middle;
    font-size: 11.5px; font-weight: 600; letter-spacing: .5px;
    padding: 2px 10px; border-radius: 999px;
    background: rgba(255,255,255,.18); color: #fff;
  }
  .promo-body { padding: 8px 26px 22px; }
  .promo-row {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 15px 0; border-bottom: 1px dashed #eceae2;
  }
  .promo-row:last-child { border-bottom: 0; }
  .promo-ico {
    flex: none; width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: color-mix(in srgb, var(--primary) 9%, #fff);
  }
  .promo-row .promo-txt { flex: 1; min-width: 0; }
  .promo-row h4 { font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .promo-row p { font-size: 13px; color: var(--muted); line-height: 1.65; margin-top: 4px; }
  .promo-soon {
    flex: none; font-size: 11px; color: #9a8f7d; background: #f4f1e8;
    padding: 3px 10px; border-radius: 999px; white-space: nowrap; margin-top: 3px;
  }

  /* 工作动态列表（首页宣传区里的真实条目） */
  .news-block { padding: 2px 0 6px; }
  .news-block > h4 {
    font-size: 14.5px; font-weight: 700; color: var(--ink);
    display: flex; align-items: center; gap: 9px; padding: 14px 0 2px;
  }
  .news-block > h4 .news-n { font-size: 12px; color: var(--muted); font-weight: 400; }
  .news-item {
    display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px dashed #eceae2;
    text-decoration: none; color: inherit;
  }
  .news-item:last-of-type { border-bottom: 0; }
  .news-item:hover .news-title { color: var(--primary); }
  .news-item .news-date {
    flex: 0 0 82px; font-size: 12.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; padding-top: 2px;
  }
  .news-item .news-body { flex: 1; min-width: 0; }
  .news-item .news-title {
    font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.5;
    transition: color .15s;
  }
  .news-item .news-sum {
    font-size: 12.5px; color: var(--muted); line-height: 1.65; margin-top: 4px;
  }
  .news-item .news-meta {
    font-size: 11.5px; color: #a8a297; margin-top: 5px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .news-item .news-tag {
    background: #eef5f1; color: var(--primary-deep);
    padding: 1px 8px; border-radius: 999px; font-size: 11px;
  }
  @media (max-width: 640px) {
    .news-item { flex-direction: column; gap: 3px; }
    .news-item .news-date { flex: none; }
  }

  /* ---------- 首页头条轮播 ----------
     参考 App 首页顶部 banner：一条大字标题 + 一句说明 + 行动按钮，点击整块跳转。
     用纯 CSS 渐变做背景，不依赖图片素材（离线也能正常显示）。 */
  .hero-banner {
    position: relative; border-radius: 18px; overflow: hidden;
    margin-bottom: 14px; min-height: 216px;
    /* 横向拖拽由脚本处理，纵向继续交给浏览器滚动。
       不加这一条的话，手机上横向滑动会先触发页面滚动，轮播收不到事件。 */
    touch-action: pan-y;
    -webkit-user-select: none; user-select: none;
    cursor: grab;
  }
  .hero-banner.dragging { cursor: grabbing; }
  .hero-banner.dragging .hb-slide { transition: none; }
  .hb-slide {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    transition: opacity .45s ease;
    display: flex; flex-direction: column; justify-content: center;
    padding: 32px 34px; color: #fff; text-decoration: none;
  }
  .hb-slide.on { opacity: 1; pointer-events: auto; position: relative; }
  .hb-slide::after {
    content: ""; position: absolute; right: -60px; top: -60px;
    width: 240px; height: 240px; border-radius: 50%;
    background: rgba(255,255,255,.07);
  }
  .hb-tag {
    display: inline-block; align-self: flex-start; font-size: 11.5px; font-weight: 700;
    letter-spacing: 1px; padding: 3px 11px; border-radius: 999px;
    background: rgba(255,255,255,.18); margin-bottom: 10px;
  }
  .hb-title { font-size: 28px; font-weight: 800; letter-spacing: .5px; line-height: 1.28; }
  .hb-title b { color: #ffe699; font-weight: 800; }
  .hb-desc { font-size: 14.5px; color: rgba(255,255,255,.85); margin-top: 9px; line-height: 1.6; max-width: 640px; }
  .hb-go {
    align-self: flex-start; margin-top: 18px; font-size: 13.5px; font-weight: 700;
    padding: 7px 20px; border-radius: 999px; background: rgba(255,255,255,.92);
    color: #175e4c; position: relative; z-index: 1;
  }
  .hb-slide:hover .hb-go { background: #fff; }

  /* 切换圆点 */
  .hb-dots {
    position: absolute; right: 18px; bottom: 14px; display: flex; gap: 6px; z-index: 2;
  }
  .hb-dot {
    width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.42);
    border: 0; padding: 0; cursor: pointer; transition: all .2s;
  }
  .hb-dot.on { background: #fff; width: 18px; border-radius: 999px; }

  @media (max-width: 720px) {
    .hero-banner { min-height: 172px; border-radius: 16px; margin-bottom: 10px; }
    .hb-slide { padding: 22px 20px; }
    .hb-title { font-size: 20px; line-height: 1.32; }
    .hb-desc { font-size: 12.5px; margin-top: 6px; }
    .hb-go { margin-top: 13px; font-size: 12px; padding: 6px 16px; }
    .hb-dots { right: 12px; bottom: 10px; }
  }

  /* ---------- 首页图标宫格（参考 App 首页的九宫格入口） ---------- */
  /* 分成两组：权益服务在上、学习资源在下。
     这样一眼能看出网站重心在权益服务，而不是把 8 个入口混在一起。 */
  .icon-grid {
    display: block;
    background: #fff; border: 1px solid var(--border); border-radius: 18px;
    padding: 6px 8px 10px; margin-bottom: 18px;
  }
  .ig-group { padding: 4px 0 2px; }
  .ig-group + .ig-group {
    margin-top: 4px; padding-top: 10px; border-top: 1px dashed #e8e5dc;
  }
  .ig-group-head {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 10px 2px; font-size: 12.5px; font-weight: 700; color: var(--ink);
  }
  .ig-group-dot {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
  }
  .ig-group-rights .ig-group-dot { background: #d4a017; }
  .ig-group-study .ig-group-dot { background: var(--primary); }
  .ig-group-cnt {
    margin-left: auto; font-size: 11px; font-weight: 400; color: var(--muted);
  }
  .ig-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .ig-item {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 8px 4px 6px; border-radius: 14px; text-decoration: none; color: inherit;
    transition: background .16s, transform .16s;
  }
  .ig-item:hover { background: #f6f9f7; transform: translateY(-2px); }
  .ig-icon {
    width: 46px; height: 46px; border-radius: 14px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 23px;
    position: relative;
  }
  .ig-rights .ig-icon { background: #fdf4dc; }
  .ig-study .ig-icon { background: #e2f0e8; }
  .ig-more .ig-icon { background: #f2f0ea; }
  .ig-label { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .ig-desc { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.3; }
  .ig-num {
    position: absolute; top: -5px; right: -7px;
    font-size: 10px; font-weight: 700; color: #fff; background: var(--primary);
    padding: 1px 5px; border-radius: 999px; min-width: 17px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .ig-rights .ig-num { background: #d4a017; }
  @media (max-width: 720px) {
    .icon-grid { padding: 4px 4px 8px; border-radius: 16px; }
    .ig-group-head { padding: 5px 8px 1px; font-size: 12px; }
    .ig-row { gap: 0; }
    .ig-icon { width: 42px; height: 42px; font-size: 21px; }
    .ig-label { font-size: 12px; }
    .ig-desc { display: none; }
  }

  /* ---------- 底部标签栏（只在小屏出现） ---------- */
  .tabbar { display: none; }
  @media (max-width: 720px) {
    .tabbar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      background: rgba(255,255,255,.97); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 7px 0 calc(7px + env(safe-area-inset-bottom, 0px));
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; color: var(--muted); text-decoration: none; padding: 2px 0;
      background: none; border: 0; font-family: inherit; cursor: pointer;
    }
    .tab-item .tab-ico { font-size: 19px; line-height: 1.1; }
    .tab-item.active { color: var(--primary); font-weight: 700; }
    /* 给底部标签栏留出空间，避免盖住最后一段内容 */
    body { padding-bottom: 62px; }
  }

  /* ---------- 紧凑 hero（首页用） ---------- */
  /* ---------- 品牌条（取代原来的大 hero） ----------
     原来的 hero 占约 200px 高，第一屏几乎全是标题。
     现在压成一条：站名 + 一句定位 + 三个数字，约 70px，
     把首屏空间让给头条轮播和图标宫格。 */
  .brandbar {
    background: linear-gradient(135deg, #0f4436 0%, #175e4c 55%, #1d7a60 100%);
    color: #fff; padding: 8px 0;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .brandbar .wrap {
    display: flex; align-items: center; gap: 14px; flex-wrap: nowrap;
    min-height: 34px;                       /* 8 + 34 + 8 = 50px 总高 */
  }
  .brand-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex: 1; }
  .brandbar h1 {
    font-size: 21px; font-weight: 800; letter-spacing: 1.2px; line-height: 1;
    white-space: nowrap; flex: none;
  }
  .brandbar h1 em { font-style: normal; color: var(--accent); }
  .brandbar p {
    font-size: 12.5px; color: #c6d8cf; line-height: 1; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .brandbar p b { color: #fff; font-weight: 600; }
  .bp-short { display: none; }
  .brand-stats {
    margin-left: auto; display: flex; gap: 16px; align-items: baseline;
    font-size: 11.5px; color: #a9c3b8; white-space: nowrap; flex: none;
  }
  .brand-stats b {
    font-size: 15px; font-weight: 800; color: #fff; margin-right: 3px;
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 780px) {
    .brandbar { padding: 7px 0; }
    .brandbar .wrap { min-height: 36px; gap: 10px; }
    .brandbar h1 { font-size: 19px; }
    .bp-long { display: none; }
    .bp-short { display: inline; }
    .brandbar p { font-size: 12px; }
    .brand-stats { gap: 11px; font-size: 10.5px; }
    .brand-stats b { font-size: 13.5px; }
  }
  @media (max-width: 420px) {
    /* 超窄屏：先藏「试卷」，保住「反馈渠道」和「资源」 —— 权益是站点重心 */
    .brand-stats span:nth-child(3) { display: none; }
  }

  .hero.compact { padding: 34px 0 30px; }
  .hero.compact h1 { font-size: 40px; }
  .hero.compact p.sub { margin-top: 10px; font-size: 14.5px; max-width: 520px; }
  .hero.compact .hero-stats { gap: 26px; }
  .hero.compact .hero-stats b { font-size: 26px; }
  .hero.compact .hero-stats span { font-size: 12px; }
  @media (max-width: 720px) {
    .hero.compact { padding: 26px 0 22px; }
    .hero.compact h1 { font-size: 32px; }
    .hero.compact p.sub { font-size: 13.5px; }
    .hero.compact .hero-stats { gap: 22px; margin-left: 0; }
    .hero.compact .hero-stats b { font-size: 22px; }
  }

  /* 典型问题处理（权益简报里的逐项进展） */
  .iss-block { padding: 2px 0 6px; }
  .iss-block > h4 {
    font-size: 14.5px; font-weight: 700; color: var(--ink);
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding: 14px 0 2px;
  }
  .iss-block > h4 .iss-n { font-size: 12px; color: var(--muted); font-weight: 400; }
  .iss-meta {
    font-size: 12px; color: var(--muted); padding: 2px 0 10px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .iss-meta a { color: var(--primary); text-decoration: none; font-weight: 600; }
  .iss-meta a:hover { text-decoration: underline; }
  .iss-item {
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; background: #fff;
  }
  .iss-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 6px; }
  .iss-head .iss-ico { font-size: 16px; }
  .iss-head .iss-name { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .iss-head .iss-cnt {
    font-size: 11px; color: var(--primary-deep); background: #e2f0e8;
    padding: 1px 8px; border-radius: 999px;
  }
  .iss-done, .iss-todo { font-size: 12.5px; line-height: 1.65; margin-top: 4px; }
  .iss-done { color: #3d5a4d; }
  .iss-todo { color: var(--muted); }
  .iss-done b, .iss-todo b { font-weight: 700; }
  .iss-done b { color: #17603f; }
  .iss-todo b { color: #9a8f7d; }

  /* 联系方式速查（首页「如何找到我们」） */
  .ct-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 2px 20px; margin-top: 8px;
  }
  .ct-row {
    display: flex; align-items: baseline; gap: 10px; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px dashed #eceae2; font-size: 13px;
  }
  .ct-row .ct-name { color: var(--ink); font-weight: 600; }
  .ct-row .ct-val {
    color: var(--primary); text-decoration: none; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  }
  .ct-row .ct-val:hover { text-decoration: underline; }

  /* 两个入口卡片 */
  .entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .entry {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid var(--border); border-radius: 18px; padding: 26px 26px 22px;
    background: #fff; position: relative; overflow: hidden;
    transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  .entry::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
    background: var(--primary);
  }
  .entry-rights::before { background: linear-gradient(90deg, #b8860b, #d4a017); }
  .entry-study::before { background: linear-gradient(90deg, var(--primary-deep), #23896c); }
  .entry:hover {
    transform: translateY(-3px); border-color: rgba(23,94,76,.35);
    box-shadow: 0 14px 34px rgba(34,48,43,.12);
  }
  .entry-tag {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    padding: 3px 11px; border-radius: 999px; margin-bottom: 12px;
  }
  .entry-rights .entry-tag { background: #fdf4dc; color: #8a6508; }
  .entry-study .entry-tag { background: #e2f0e8; color: var(--primary-deep); }
  .entry h3 { font-size: 20px; font-weight: 800; letter-spacing: .3px; color: var(--ink); }
  .entry > p { font-size: 13.5px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .entry ul { margin: 16px 0 0; padding: 0; list-style: none; }
  .entry li {
    font-size: 13px; color: #4d5a53; padding: 6px 0 6px 20px; position: relative;
    border-bottom: 1px solid #f4f2ec;
  }
  .entry li:last-child { border-bottom: 0; }
  .entry li::before {
    content: ""; position: absolute; left: 4px; top: 13px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
  }
  .entry-rights li::before { background: #d4a017; }
  .entry li b { color: var(--ink); font-weight: 700; }
  .entry-go {
    display: inline-block; margin-top: 18px; font-size: 14px; font-weight: 700;
    color: var(--primary);
  }
  .entry-rights .entry-go { color: #8a6508; }

  @media (max-width: 760px) {
    .entry-grid { grid-template-columns: 1fr; gap: 14px; }
    .entry { padding: 22px 20px 18px; }
    .entry h3 { font-size: 18px; }
    .promo-head { padding: 18px 18px; }
    .promo-body { padding: 4px 18px 16px; }
    .promo-row { gap: 11px; }
    .promo-soon { display: none; }
  }
  @media (max-width: 720px) {
    .rt-list { grid-template-columns: 1fr; }
    .rt-intro { padding: 15px 16px; font-size: 13.5px; }
  }

  footer {
    border-top: 1px solid var(--border); padding: 30px 0 46px;
    text-align: center; color: var(--muted); font-size: 13px;
  }
  footer b { color: var(--primary); letter-spacing: 1px; }

  /* ===== 二级子分类 ===== */
  #subchips {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding-top: 10px;
  }
  #subchips[hidden] { display: none; }
  #subchips .sub-label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  #subchips .sub-chip {
    padding: 5px 13px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    cursor: pointer; transition: all .18s;
  }
  #subchips .sub-chip:hover { border-color: var(--primary); color: var(--primary); }
  #subchips .sub-chip.active {
    background: color-mix(in srgb, var(--primary) 12%, #fff);
    border-color: var(--primary); color: var(--primary-deep); font-weight: 700;
  }
  #subchips .sub-count { color: var(--muted); font-weight: 400; margin-left: 3px; }

  /* ===== 顶栏模式切换（资源库 / 学习路径 / 技能自查）===== */
  .modebar {
    border-bottom: 1px solid var(--border);
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
  }
  /* ⚠️ 必须换行：一级按钮在窄屏（<420px）下总宽超过视口，
     不换行会把整个页面撑宽，导致顶部文字、分类标签也跟着被切掉。 */
  .modebar .wrap {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding-top: 10px; padding-bottom: 10px;
  }
  .mode-btn {
    padding: 8px 20px; border-radius: 999px; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    cursor: pointer; transition: all .18s;
  }
  .mode-btn:hover { color: var(--primary); border-color: var(--primary); }
  .mode-btn.active { background: var(--primary-deep); border-color: var(--primary-deep); color: #fff; }
  .mode-btn .n { font-weight: 400; opacity: .75; margin-left: 4px; }

  /* 二级导航：一级（权益服务 / 学习资源）下面的子项。
     视觉上比一级轻，避免两层按钮抢视线；用左侧竖线表示从属关系。 */
  .subnav {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 0 0 10px 2px; margin-top: -2px;
  }
  .subnav[hidden] { display: none; }
  .sub-btn {
    padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    border: 1px solid transparent; background: transparent; color: var(--muted);
    cursor: pointer; transition: all .16s; font-family: inherit;
  }
  .sub-btn:hover { color: var(--primary); background: #eef5f1; }
  .sub-btn.active {
    background: #e2f0e8; color: var(--primary-deep); border-color: #cbe4d8;
  }
  .sub-btn .n { font-weight: 400; opacity: .7; margin-left: 4px; }

  /* ===== 学习路径 ===== */
  .guide-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px 24px; margin-bottom: 14px; cursor: pointer; transition: all .2s;
  }
  .guide-card:hover { border-color: rgba(23,94,76,.35); box-shadow: 0 10px 28px rgba(34,48,43,.10); transform: translateY(-2px); }
  .guide-card .g-top { display: flex; align-items: center; gap: 14px; }
  .guide-card .g-icon {
    width: 46px; height: 46px; flex: none; border-radius: 13px; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--primary) 10%, #fff);
    border: 1px solid color-mix(in srgb, var(--primary) 20%, #fff);
  }
  .guide-card h3 { font-size: 17px; font-weight: 700; }
  .guide-card .g-sub { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  .guide-card .g-meta { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .guide-card .g-meta span { background: #f1efe6; padding: 3px 11px; border-radius: 999px; }

  .guide-detail { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 26px 28px; }
  .guide-detail .gd-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 6px; }
  .guide-detail h2 { font-size: 22px; font-weight: 800; }
  .guide-detail .gd-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .back-btn {
    margin-bottom: 16px; padding: 7px 16px; border-radius: 999px; font-size: 13.5px;
    border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .back-btn:hover { border-color: var(--primary); color: var(--primary); }
  .gd-step { border-top: 1px solid var(--border); padding: 22px 0 6px; }
  .gd-step:first-of-type { border-top: 0; }
  .gd-step h4 { font-size: 16px; font-weight: 700; color: var(--primary-deep); margin-bottom: 12px; display: flex; align-items: center; gap: 9px; }
  .gd-step h4 .sn {
    width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--primary); color: #fff;
    font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .gd-text { font-size: 14px; color: #3d4b45; line-height: 1.8; margin-bottom: 14px; }
  .gd-res { list-style: none; margin-bottom: 14px; }
  .gd-res li { display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px dashed var(--border); }
  .gd-res li:last-child { border-bottom: 0; }
  .gd-res .ri { flex: none; font-size: 15px; line-height: 1.6; }
  .gd-res .rt { font-weight: 600; }
  .gd-res .rt a { color: var(--primary); text-decoration: none; }
  .gd-res .rt a:hover { text-decoration: underline; }
  .gd-res .rn { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.7; }
  .gd-ck { background: #f8f6ee; border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 6px; }
  .gd-ck b { font-size: 13px; color: var(--primary-deep); display: block; margin-bottom: 7px; }
  .gd-ck ul { list-style: none; }
  .gd-ck li { font-size: 13.5px; color: #4a5852; padding: 3px 0 3px 20px; position: relative; }
  .gd-ck li::before { content: "○"; position: absolute; left: 4px; color: var(--muted); }

  /* ===== 技能自查表 ===== */
  .sk-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .sk-head .sk-sum { font-size: 14px; color: var(--muted); }
  .sk-head .sk-sum b { color: var(--primary-deep); font-size: 17px; }
  .sk-reset { padding: 6px 14px; border-radius: 999px; font-size: 13px; border: 1px solid var(--border); background: var(--card); cursor: pointer; color: var(--muted); }
  .sk-reset:hover { border-color: #b91c1c; color: #b91c1c; }
  .sk-group { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; margin-bottom: 14px; }
  .sk-group h3 { font-size: 15.5px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
  .sk-group .g-cnt { font-size: 12.5px; color: var(--muted); font-weight: 400; }
  .sk-bar { height: 5px; background: #ece8dc; border-radius: 999px; margin: 10px 0 14px; overflow: hidden; }
  .sk-bar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .25s; }
  .sk-item { display: flex; gap: 11px; padding: 7px 0; cursor: pointer; align-items: flex-start; border-radius: 8px; }
  .sk-item:hover { background: #faf8f2; }
  .sk-item input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; flex: none; }
  .sk-item .sk-tx { font-size: 14px; line-height: 1.65; }
  .sk-item.done .sk-tx { color: var(--muted); text-decoration: line-through; }
  .sk-item .sk-ref { font-size: 12.5px; color: var(--primary); margin-top: 2px; }

  /* ===== 资源详情弹层 =====

// ===== 二级筛选：选中大类后，在其下方显示该大类的子分类 =====
// 设计：大类仍是第一层，子分类只在大类被选中时出现，避免首页一次显示 52 个标签。
const subchips = document.getElementById("subchips");
let activeSub = "";

function renderSubchips() {
  subchips.innerHTML = "";
  if (activeCategory === "全部") { subchips.hidden = true; return; }

  const inCat = RESOURCES.filter((r) => r.category === activeCategory);
  const subs = [];
  for (const r of inCat) if (r.subcategory && !subs.includes(r.subcategory)) subs.push(r.subcategory);

  if (subs.length <= 1) { subchips.hidden = true; return; }  // 只有一个子分类就不必显示
  subchips.hidden = false;

  const label = document.createElement("span");
  label.className = "sub-label";
  label.textContent = "子分类：";
  subchips.appendChild(label);

  const mk = (name, count) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sub-chip" + (activeSub === name ? " active" : "");
    b.textContent = name;
    if (count !== undefined) {
      const s = document.createElement("span");
      s.className = "sub-count";
      s.textContent = "(" + count + ")";
      b.appendChild(s);
    }
    b.addEventListener("click", () => {
      activeSub = (name === "全部" ? "" : name);
      renderSubchips();
      render();
    });
    return b;
  };

  subchips.appendChild(mk("全部", inCat.length));
  for (const s of subs) subchips.appendChild(mk(s, inCat.filter((r) => r.subcategory === s).length));
}

/* 分类标签按当前分区的可见分类重建。
   权益服务区只显示「校内平台 / 校园信息」，学习资源区显示其余 8 类。
   重建而不是一次性建好：同一个 #chips 容器被多个视图复用，切分区时要换掉标签。 */
function renderChips() {
  const cats = currentCats();
  // 清掉旧的分类标签（保留搜索框与"只看免费"）
  for (const c of Array.from(chips.querySelectorAll(".chip"))) c.remove();

  const ft = chips.querySelector(".free-toggle");
  const allBtn = document.createElement("button");
  allBtn.type = "button";
  allBtn.className = "chip" + (activeCategory === "全部" ? " active" : "");
  allBtn.textContent = "全部";
  allBtn.addEventListener("click", () => {
    activeCategory = "全部";
    activeSub = "";
    for (const c of chips.querySelectorAll(".chip")) c.classList.toggle("active", c.textContent === "全部");
    renderSubchips();
    render();
  });
  chips.insertBefore(allBtn, ft);

  for (const cat of cats) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip" + (cat === activeCategory ? " active" : "");
    btn.textContent = cat;
    btn.addEventListener("click", () => {
      activeCategory = cat;
      activeSub = "";
      for (const c of chips.querySelectorAll(".chip")) c.classList.toggle("active", c.textContent === cat);
      renderSubchips();
      render();
    });
    chips.insertBefore(btn, ft);
  }
}

/* ===== 搜索匹配 =====
   为什么要拆词：以前是 searchText(r).includes("数学 期末") —— 把整个输入当成一个
   连续字符串去匹配，而资源里不可能出现"数学 期末"这一串，所以多关键词永远搜不到东西。
   现在改成：按空格拆成多个词，每个词都要命中（AND）。搜「数学 期末」= 同时含这两个词。 */

// 归一化：去掉空格与常见连接符，让 "pytorch" 能匹配 "PyTorch 版"、"b1" 能匹配 "B1"。
// ⚠️ 必须保留 + 和 # —— 它们是 C++ / C# 这类名称的语义字符。
//    踩过的坑：把 + 当标点扔掉后，搜 "c++" 会被拆成 "c"，于是命中所有含字母 C 的条目。
function normLoose(s) {
  return String(s == null ? "" : s).toLowerCase()
    .replace(/[\s\u3000]+/g, "")
    .replace(/[-_—－·・.。]/g, "");
}

function normText(s) {
  return String(s == null ? "" : s).toLowerCase();
}

/* 抽出"参与匹配的字符"及其在原文中的下标。
   只保留汉字 / 拉丁字母 / 数字 / + / # —— 标点与空格不参与匹配。
   + 与 # 必须保留：C++、C# 是真实的编程语言名，扔掉它们会让 "c++" 退化成 "c"。
   这一步是模糊匹配与高亮的共同基础，两者必须用同一套口径，否则会出现
   "搜到了却不高亮"或"高亮了却搜不到"的矛盾。 */
function baseChars(src) {
  const chars = [];
  const idx = [];
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (/[\u4e00-\u9fa5]/.test(ch) || /[0-9A-Za-z+#]/.test(ch)) {
      chars.push(ch.toLowerCase());
      idx.push(i);
    }
  }
  return { chars, idx };
}

/* 最长公共子串长度。用于汉字的错别字容错。
   为什么不用"按位置逐个比较"：「菜鸟教成」对上「菜鸟教程」时，
   位置 3、4 都不相等（教≠程、成≠程），逐位比较会得出相似度 0.5 而漏掉；
   但两者真正共享的是「菜鸟教」(3/4)，最长公共子串才反映真实相似度。 */
function lcsLen(a, b) {
  if (!a.length || !b.length) return 0;
  let prev = new Array(b.length + 1).fill(0);
  let best = 0;
  for (let i = 1; i <= a.length; i++) {
    const cur = new Array(b.length + 1).fill(0);
    for (let j = 1; j <= b.length; j++) {
      if (a[i - 1] === b[j - 1]) {
        cur[j] = prev[j - 1] + 1;
        if (cur[j] > best) best = cur[j];
      }
    }
    prev = cur;
  }
  return best;
}

/* 模糊容错。汉字与拉丁用不同策略 —— 这是踩过坑的地方：
     汉字：最长公共子串 / 词长 >= 0.75 即命中（「菜鸟教成」→「菜鸟教程」）。
     拉丁：子序列 + 跨度紧凑。绝不能只看"字符是否出现过" ——
           字母在英文文案里到处都是，会让 leetcode 命中几十条无关资源。
           子序列要求字母按顺序出现，且首尾跨度不能远大于词长。 */
function fuzzyHit(text, term) {
  const t = normLoose(term);
  if (!t) return false;
  const isCJK = /[\u4e00-\u9fa5]/.test(t);
  const { chars: s } = baseChars(text);
  if (!s.length) return false;

  if (isCJK) {
    const tc = t.split("").filter((c) => /[\u4e00-\u9fa5]/.test(c));
    if (tc.length < 3) return false;
    // 与文本的若干候选窗口比较：直接用整段文本做 LCS 即可（LCS 本身按子串算）
    const ratio = lcsLen(tc, s) / tc.length;
    return ratio >= 0.75;
  }

  // 拉丁：子序列 + 跨度约束
  if (t.length < 4) return false;
  const tc = t.split("").filter((c) => /[0-9a-z]/.test(c));
  if (tc.length < 4) return false;
  let ti = 0;
  let first = -1;
  let last = -1;
  for (let i = 0; i < s.length && ti < tc.length; i++) {
    if (s[i] === tc[ti]) {
      if (first === -1) first = i;
      last = i;
      ti++;
    }
  }
  if (ti < tc.length) return false;
  return (last - first + 1) <= tc.length * 3;
}

function looseHit(text, term) {
  if (!term) return false;
  if (normText(text).includes(normText(term))) return true;
  if (normLoose(text).includes(normLoose(term))) return true;
  return fuzzyHit(text, term);
}

/* 把查询拆成词。中英混排时：英文/数字按空格与标点拆，中文连续串保留整段
   （再按 2 字滑窗补一些子词，便于"期末"这种短词命中）。 */
function splitQuery(q) {
  const raw = String(q == null ? "" : q).trim();
  if (!raw) return [];
  const terms = [];
  for (const part of raw.split(/[\s\u3000,，、;；]+/)) {
    const p = part.trim();
    if (!p) continue;
    terms.push(p);
    // 中文长串再拆出 2 字滑窗（"数学分析" → 数学/学分/分析），提高召回
    const cn = p.replace(/[^\u4e00-\u9fa5]/g, "");
    if (cn.length >= 3) {
      for (let i = 0; i + 2 <= cn.length; i++) {
        const g = cn.slice(i, i + 2);
        if (!terms.includes(g)) terms.push(g);
      }
    }
  }
  return terms;
}

/* 一条资源对某个词的匹配得分；返回 0 表示不命中。 */
function termScore(r, term) {
  if (!term) return 0;
  let s = 0;
  if (looseHit(r.name, term)) s += 100;
  if ((r.tags || []).some((t) => looseHit(t, term))) s += 50;
  if (looseHit(r.subcategory, term)) s += 30;
  if (looseHit(r.category, term)) s += 20;
  if (looseHit(r.source, term)) s += 15;
  if (looseHit(r.description, term)) s += 10;
  return s;
}
/* 相关度打分：所有词都命中才算匹配，分数为各词得分之和。
   注意：打分只影响【顺序】，不影响【是否出现】—— 命中即列出。 */
function scoreOf(r, terms) {
  const list = Array.isArray(terms) ? terms : splitQuery(terms);
  if (!list.length) return 0;
  let total = 0;
  for (const t of list) {
    const s = termScore(r, t);
    if (s === 0) return 0;          // 有一个词没命中 → 整条不算匹配
    total += s;
  }
  // 标题命中的条目，名字越短通常越"就是它"
  if (looseHit(r.name, list[0])) total += Math.max(0, 20 - r.name.length) / 20;
  return total;
}

/* 搜不到时给建议 —— 从资源库的标签里找与查询最接近的。
   为什么值得做：空结果只说"换个关键词"，等于把问题丢回给用户；
   而这些标签是站内真实存在的词，点一下就能搜到东西。 */
function suggestTags(keyword, limit) {
  if (!keyword) return [];
  const kw = keyword.toLowerCase();
  // 查询词拆解：英文按空格/标点拆，中文取 2 字滑窗 —— 便于与标签做字符级比对
  const frags = new Set();
  for (const t of kw.split(/[\s,，、。.·()（）\-_/]+/)) if (t.length >= 2) frags.add(t);
  const cn = kw.replace(/[^\u4e00-\u9fa5]/g, "");
  for (let i = 0; i + 2 <= cn.length; i++) frags.add(cn.slice(i, i + 2));
  if (!frags.size) frags.add(kw);

  const counts = new Map();
  for (const r of RESOURCES) for (const t of (r.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);

  const scored = [];
  for (const [tag, count] of counts) {
    const lower = tag.toLowerCase();
    let s = 0;
    if (lower === kw) s = 1000;
    else if (lower.includes(kw) || kw.includes(lower)) s = 500;
    else for (const f of frags) if (lower.includes(f)) s += 60;
    if (s > 0) scored.push({ tag, score: s + Math.min(count, 30) });
  }
  scored.sort((a, b) => b.score - a.score || a.tag.localeCompare(b.tag));
  return scored.slice(0, limit || 6).map((x) => x.tag);
}

function searchText(r) {
  // 检索范围：名称 + 简介 + 标签 + 分类 + 来源站点。
  // 标签参与检索是"标签搜索"的基础；分类与来源一起纳入，方便直接搜"论文""镜像站""校内平台"。
  return [
    r.name,
    r.description,
    (r.tags || []).join(" "),
    r.category,
    r.source || "",
  ].join(" ").toLowerCase();
}

/* 判断某条资源在哪些字段命中了关键词 —— 用于卡片上的"匹配位置"提示。
   为什么需要它：用户搜一个词，结果里出现看起来不相干的条目时会困惑，
   标明"因为标签里有这个词"就能让他立刻判断要不要点。 */
/* 命中了哪些字段 —— 用于卡片上的「匹配：…」提示。
   用松散匹配（跳过空格/连字符），与搜索口径一致，否则会出现
   "明明搜到了，却不显示命中原因"的矛盾。 */
function matchReasons(r, terms) {
  const list = Array.isArray(terms) ? terms : splitQuery(terms);
  if (!list.length) return [];
  const any = (s) => list.some((t) => looseHit(s, t));
  const out = [];
  if (any(r.name)) out.push("名称");
  const hitTags = (r.tags || []).filter((t) => list.some((x) => looseHit(t, x)));
  if (hitTags.length) out.push("标签「" + hitTags.slice(0, 2).join("、") + "」");
  if (any(r.description)) out.push("简介");
  if (any(r.category)) out.push("分类");
  if (any(r.subcategory)) out.push("子分类");
  if (any(r.source)) out.push("来源");
  return out;
}

/* 找出文本里所有命中片段的位置，用于高亮。
   关键点：搜索用的是「松散匹配」（忽略空格与连字符），所以高亮也必须按同样口径，
   否则搜 pytorch 时 "PyTorch 版" 明明命中了却看不到高亮 —— 用户会以为搜错了。
   segs = 归一化后的字符在原文中的下标数组（被忽略的字符不进入该数组）。 */
function hitRanges(src, terms) {
  const { chars, idx } = baseChars(src);
  if (!chars.length) return [];
  const norm = chars.join("");
  const ranges = [];
  for (const t of terms) {
    // 高亮用的词同样要保留 + 和 #，与 baseChars 口径一致
    const nt = baseChars(String(t)).chars.join("");
    if (!nt) continue;
    let from = 0;
    for (;;) {
      const at = norm.indexOf(nt, from);
      if (at === -1) break;
      ranges.push([idx[at], idx[at + nt.length - 1] + 1]);
      from = at + nt.length;
    }
  }
  // 合并重叠区间，避免嵌套 <mark>
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const rg of ranges) {
    const last = merged[merged.length - 1];
    if (last && rg[0] <= last[1]) last[1] = Math.max(last[1], rg[1]);
    else merged.push([rg[0], rg[1]]);
  }
  return merged;
}

/* 把文本里出现的命中片段包进 <mark>。必须走 DOM API 而不是拼 HTML 字符串，
   否则资源标题里的 < > & 等字符会被当成标签解析（名称里确实有 "C++" 这类内容）。 */
function highlightInto(el, text, terms) {
  el.textContent = "";
  const src = String(text == null ? "" : text);
  const list = Array.isArray(terms) ? terms : splitQuery(terms);
  if (!list.length) { el.textContent = src; return; }
  const ranges = hitRanges(src, list);
  if (!ranges.length) { el.textContent = src; return; }
  let from = 0;
  for (const [a, b] of ranges) {
    if (a > from) el.appendChild(document.createTextNode(src.slice(from, a)));
    const m = document.createElement("mark");
    m.className = "hl";
    m.textContent = src.slice(a, b);
    el.appendChild(m);
    from = b;
  }
  if (from < src.length) el.appendChild(document.createTextNode(src.slice(from)));
}

/* 结果计数条：说清"筛完剩几条、按什么关键词筛的"，并给一个清空按钮。
   只在用户主动筛选时出现 —— 默认浏览全部时不打扰。 */
const resultBar = document.getElementById("resultBar");
let rbClearText = null;   // 桌面端显示"清除筛选"，窄屏显示"清除"

function renderResultBar(terms, count) {
  if (!resultBar) return;
  const hasTerms = Array.isArray(terms) ? terms.length > 0 : !!terms;
  const filtering = !!(hasTerms || activeCategory !== "全部" || activeSub || freeOnly.checked);
  if (!filtering) { resultBar.hidden = true; resultBar.textContent = ""; return; }

  resultBar.hidden = false;
  resultBar.textContent = "";

  const label = document.createElement("span");
  label.appendChild(document.createTextNode("找到 "));
  const b = document.createElement("b");
  b.textContent = String(count);
  label.appendChild(b);
  label.appendChild(document.createTextNode(" 条"));

  // 说清筛选条件
  const parts = [];
  if (activeCategory !== "全部") parts.push(activeCategory);
  if (activeSub) parts.push(activeSub);
  if (freeOnly.checked) parts.push("只看免费");
  if (parts.length) label.appendChild(document.createTextNode("　·　" + parts.join(" / ")));

  if (hasTerms) {
    label.appendChild(document.createTextNode("　·　关键词 "));
    const kw = document.createElement("span");
    kw.className = "rb-kw";
    kw.textContent = q.value.trim();
    label.appendChild(kw);
    // 多关键词时说明「每个词都要命中」，否则用户不知道结果是怎么筛出来的
    if (terms.length > 1) {
      label.appendChild(document.createTextNode("　·　已拆为 " + terms.length + " 个词，需全部命中"));
    }
  }
  resultBar.appendChild(label);

  const clear = document.createElement("button");
  clear.type = "button";
  clear.className = "rb-clear";
  clear.textContent = rbClearText || "清除筛选";
  clear.addEventListener("click", () => {
    q.value = "";
    freeOnly.checked = false;
    activeCategory = "全部";
    activeSub = null;
    for (const c of chips.querySelectorAll(".chip")) c.classList.toggle("active", c.textContent === "全部");
    renderSubchips();
    render();
  });
  resultBar.appendChild(clear);
}

function render() {
  const keyword = q.value.trim();
  const terms = splitQuery(keyword);
  const scope = currentCats();
  const list = RESOURCES.filter((r) => {
    // 分区过滤：每个视图只显示自己那几类资源
    if (scope.indexOf(r.category) < 0) return false;
    if (activeCategory !== "全部" && r.category !== activeCategory) return false;
    if (activeSub && r.subcategory !== activeSub) return false;
    if (freeOnly.checked && !r.free) return false;
    // 多关键词：每个词都要命中（AND）。scoreOf 返回 0 即表示有词没命中。
    if (terms.length && scoreOf(r, terms) === 0) return false;
    return true;
  });
  // 有搜索词时按相关度排序：标题命中 > 标签命中 > 子分类 > 分类 > 来源 > 简介。
  // 无搜索词时保持资源库原始顺序（策划过的顺序比"相关度"更有意义）。
  if (terms.length) {
    const scored = list.map((r, idx) => ({ r, idx, s: scoreOf(r, terms) }));
    scored.sort((a, b) => b.s - a.s || a.idx - b.idx);
    list.length = 0;
    for (const x of scored) list.push(x.r);
  }
  grid.innerHTML = "";
  renderResultBar(terms, list.length);
  renderEmptyHint(keyword, list.length);
  list.forEach((r, i) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute("data-title", r.name);
    a.style.setProperty("--cat-color", CAT_COLORS[r.category] || "var(--primary)");
    a.style.animationDelay = Math.min(i * 35, 400) + "ms";
    a.innerHTML =
      '<div class="card-head"><span class="card-icon">' + r.icon + '</span>' +
      '<span class="card-name"></span><span class="card-jump" title="直接打开网站">↗</span></div>' +
      '<p class="card-desc"></p>' +
      (keyword ? '<div class="card-why"></div>' : '') +
      '<div class="card-foot"><span class="badge cat">' + r.category + "</span>" +
      (r.free ? '<span class="badge free">免费</span>' : '<span class="badge paid">付费/部分免费</span>') +
      "</div>";
    // 高亮命中关键词，并标注命中位置（名称/标签/简介…）
    highlightInto(a.querySelector(".card-name"), r.name, terms);
    highlightInto(a.querySelector(".card-desc"), r.description, terms);
    if (terms.length) {
      const why = a.querySelector(".card-why");
      const reasons = matchReasons(r, terms);
      if (why) why.textContent = reasons.length ? "匹配：" + reasons.join(" · ") : "";
    }
    // 卡片主体 -> 打开详情；右上箭头 -> 直接跳转（阻止冒泡以免同时弹层）
    const jump = a.querySelector(".card-jump");
    if (jump) jump.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      window.open(r.url, "_blank", "noopener,noreferrer");
    });
    a.addEventListener("click", (ev) => {
      ev.preventDefault();          // 卡片主体不再直接跳转，改为看详情
      openDetail(r.name);
    });
    grid.appendChild(a);
  });
  empty.hidden = list.length > 0;
}

/* 无结果时不只是说"没找到"，而是给出站内真实存在的相近标签。
   点一下就能搜到东西 —— 比让用户自己想词有用得多。 */
function renderEmptyHint(keyword, count) {
  if (!empty) return;
  if (count > 0 || !keyword) {
    empty.textContent = "没有找到匹配的资源,换个关键词试试。";
    return;
  }
  empty.textContent = "";
  const p = document.createElement("span");
  p.textContent = "没有找到「" + q.value.trim() + "」相关的资源。";
  empty.appendChild(p);
  const tags = suggestTags(keyword, 6);
  if (!tags.length) return;
  const p2 = document.createElement("span");
  p2.className = "eh-tip";
  p2.textContent = "试试这些标签：";
  empty.appendChild(p2);
  const box = document.createElement("span");
  box.className = "eh-tags";
  for (const t of tags) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "eh-tag";
    b.textContent = t;
    b.addEventListener("click", () => {
      q.value = t;
      activeCategory = "全部";
      activeSub = "";
      for (const c of chips.querySelectorAll(".chip")) c.classList.toggle("active", c.textContent === "全部");
      renderSubchips();
      render();
    });
    box.appendChild(b);
  }
  empty.appendChild(box);
}

/* ===================================================================
   资源详情弹层
   目的：规范要求"用户打开资源卡片即可知道：这是什么、适合谁、是否免费、
   是否需要注册、是否需要学生身份、是否需要特殊配置"。此前卡片只显示
   名称/简介/分类/免费四项，其余字段无从查看。
   =================================================================== */
const detailMask = document.getElementById("detail-mask");
const detailBox = document.getElementById("detail-box");
let lastFocus = null;

// 把资源记录里的字段拆成"能直接展示"和"未核验"两类
const FIELD_KEYS = [
  ["account_requirement", "注册要求"],
  ["student_requirement", "学生身份"],
  ["network_requirement", "网络要求"],
  ["hardware_requirement", "硬件要求"],
  ["language_support", "语言支持"],
  ["cost", "费用"],
  ["source", "来源站点"],
  ["subcategory", "子分类"],
  ["last_verified", "最近核验"],
  ["verification_status", "核验状态"],
  ["alternative_resources", "国内替代"],
];

function isUnknown(v) {
  if (v === undefined || v === null) return true;
  const s = String(v).trim();
  return s === "" || s === "未核验" || s === "待复核";
}

function openDetail(title) {
  const r = byTitle.get(title);
  if (!r) return;
  lastFocus = document.activeElement;
  detailBox.innerHTML = "";
  detailBox.style.setProperty("--dt-color", CAT_COLORS[r.category] || "var(--primary)");

  // 头部
  const head = document.createElement("div");
  head.className = "dt-head";
  head.innerHTML =
    '<span class="dt-icon"></span>' +
    '<div style="min-width:0"><div class="dt-title"></div><div class="dt-sub"></div></div>' +
    '<button type="button" class="dt-close" aria-label="关闭">✕</button>';
  head.querySelector(".dt-icon").textContent = r.icon || "•";
  head.querySelector(".dt-title").textContent = r.name;
  head.querySelector(".dt-sub").textContent = r.category + (r.subcategory ? " · " + r.subcategory : "");
  head.querySelector(".dt-close").addEventListener("click", closeDetail);
  detailBox.appendChild(head);

  // 简介
  const desc = document.createElement("p");
  desc.className = "dt-desc";
  desc.textContent = r.description || "";
  detailBox.appendChild(desc);

  // 标签
  if (Array.isArray(r.tags) && r.tags.length) {
    const tw = document.createElement("div");
    tw.className = "dt-tags";
    for (const t of r.tags) {
      const s = document.createElement("span");
      s.textContent = t;
      tw.appendChild(s);
    }
    detailBox.appendChild(tw);
  }

  // 操作
  const acts = document.createElement("div");
  acts.className = "dt-actions";
  const go = document.createElement("a");
  go.className = "dt-go";
  go.href = r.url;
  go.target = "_blank";
  go.rel = "noopener noreferrer";
  go.textContent = "前往网站 ↗";
  acts.appendChild(go);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    const cp = document.createElement("button");
    cp.type = "button";
    cp.className = "dt-copy";
    cp.textContent = "复制链接";
    cp.addEventListener("click", () => {
      navigator.clipboard.writeText(r.url).then(() => {
        cp.textContent = "已复制 ✓";
        setTimeout(() => { cp.textContent = "复制链接"; }, 1600);
      }).catch(() => { cp.textContent = "复制失败"; });
    });
    acts.appendChild(cp);
  }

  // 报告问题：把资源信息复制到剪贴板，再打开反馈问卷。
  // 为什么用"复制 + 打开"而不是直接拼 URL 参数：
  // 腾讯问卷的链接参数预填是【商业版付费功能】，免费版用不了（官方文档已注明）。

function countIn(cats) {

let route = { home: true, sec: "", sub: "" };

function parseRoute() {
  var h = String(location.hash || "").replace(/^#\/?/, "");
  if (!h) return { home: true, sec: "", sub: "" };
  var parts = h.split("/");
  var sec = parts[0] || "";
  var found = null;
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === sec) found = SECTIONS[i];
  if (!found) return { home: true, sec: "", sub: "" };
  var sub = parts[1] || "";
  var ok = false;
  for (var j = 0; j < found.subs.length; j++) if (found.subs[j].id === sub) ok = true;
  if (!ok) sub = found.subs[0].id;
  return { home: false, sec: sec, sub: sub };
}

function go(sec, sub) {
  location.hash = sec ? ("#/" + sec + (sub ? "/" + sub : "")) : "#/";
}

const byTitle = new Map();
function rebuildTitleIndex() {
  byTitle.clear();
  for (const r of RESOURCES) byTitle.set(r.name, r);
}

function currentSection() {
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === route.sec) return SECTIONS[i];
  return null;
}

function renderModebar() {

  var HOME = { id: "", label: "首页" };
  var tops = [HOME].concat(SECTIONS);
  for (var i = 0; i < tops.length; i++) {
    (function (s) {
      var b = document.createElement("button");
      b.type = "button";
      var isActive = (s.id === "" && route.home) || (s.id !== "" && route.sec === s.id);
      b.className = "mode-btn" + (isActive ? " active" : "");
      b.textContent = s.label;
      b.addEventListener("click", function () { go(s.id, ""); });
      modebar.appendChild(b);
    })(tops[i]);
  }

  // 二级：当前分区下的子视图
  subnav.innerHTML = "";
  var sec = currentSection();
  if (sec) {
    subnav.hidden = false;
    for (var k = 0; k < sec.subs.length; k++) {
      (function (sub) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "sub-btn" + (route.sub === sub.id ? " active" : "");
        b.textContent = sub.label;
        if (sub.n) {
          var sp = document.createElement("span");
          sp.className = "n";
          sp.textContent = sub.n();
          b.appendChild(sp);
        }
        b.addEventListener("click", function () { go(sec.id, sub.id); });
        subnav.appendChild(b);
      })(sec.subs[k]);
    }
  } else {
    subnav.hidden = true;
  }
}

function applyMode() {
  route = parseRoute();

  var isRes = !!RESOURCE_VIEWS[route.sub];
  viewHome.hidden = !route.home;
  viewRes.hidden = !isRes;
  viewGui.hidden = route.sub !== "guides";
  viewSki.hidden = route.sub !== "skills";
  viewExa.hidden = route.sub !== "exams";
  viewCha.hidden = route.sub !== "channels";
  // 搜索与筛选栏只对资源类视图有意义
  if (toolbar) toolbar.hidden = !isRes;

  // 在不同资源视图之间切换时，重置分类/子分类筛选，否则会带着上一个视图的条件
  if (isRes && lastResView !== route.sub) {
    activeCategory = "全部";
    activeSub = "";

  lastResView = isRes ? route.sub : "";

  renderModebar();
  renderTabbar();
  renderIconGrid();

  else hbPause();

  if (route.sub === "exams") renderExams();
  if (route.sub === "channels") renderRights();

  window.scrollTo({ top: 0, behavior: "auto" });

let hbIndex = 0;
let hbTimer = null;

function renderHeroBanner() {
  var box = document.getElementById("heroBanner");
  if (!box) return;

      });

function hbGo(i) {
  hbIndex = i;
  var box = document.getElementById("heroBanner");
  if (!box) return;
  var slides = box.querySelectorAll(".hb-slide");
  var dots = box.querySelectorAll(".hb-dot");
  for (var k = 0; k < slides.length; k++) {
    var on = k === i;
    if (on) slides[k].classList.add("on"); else slides[k].classList.remove("on");
    slides[k].style.transform = "";      // 清掉拖动时留下的位移
  }
  for (var m = 0; m < dots.length; m++) {
    if (m === i) dots[m].classList.add("on"); else dots[m].classList.remove("on");
  }
  hbStart();                                       // 手动切换后重新计时
}

/* 手动滑动：Pointer Events 一套代码同时覆盖触屏与鼠标。
   设计要点：
   - 拖动中暂停自动播放，松手后重新计时（否则手还没松开就被定时器切走）
   - 拖动超过阈值才算切页，避免轻点误触
   - 拖过之后要吃掉后续的 click，否则会触发链接跳转 */
var hbDrag = { on: false, x0: 0, dx: 0, moved: false, id: null };
var HB_SWIPE_MIN = 45;      // 判定为切页的最小横向位移（px）

function hbSlides() {
  var box = document.getElementById("heroBanner");
  return box ? box.querySelectorAll(".hb-slide") : [];
}

function hbMove(dx) {
  var cur = hbSlides()[hbIndex];
  if (!cur) return;
  if (dx) cur.style.transform = "translateX(" + dx + "px)";
  else cur.style.transform = "";
}

function hbBindDrag() {
  var box = document.getElementById("heroBanner");
  if (!box || box.getAttribute("data-drag")) return;
  box.setAttribute("data-drag", "1");

  box.addEventListener("pointerdown", function (e) {
    // 点圆点时不启动拖动
    var t = e.target;
    while (t && t !== box) {
      if (t.className && String(t.className).indexOf("hb-dot") >= 0) return;
      t = t.parentNode;
    }
    if (e.pointerType === "mouse" && e.button !== 0) return;
    hbDrag.on = true;
    hbDrag.x0 = e.clientX;
    hbDrag.dx = 0;
    hbDrag.moved = false;
    hbDrag.id = e.pointerId;
    hbPause();
    box.classList.add("dragging");
  });

  box.addEventListener("pointermove", function (e) {
    if (!hbDrag.on) return;
    var dx = e.clientX - hbDrag.x0;
    hbDrag.dx = dx;
    if (Math.abs(dx) > 6) hbDrag.moved = true;
    // 阻尼：跟手程度 0.75，拖到头会有点"拉不动"的手感
    hbMove(dx * 0.75);
  });

  function endDrag(e) {
    if (!hbDrag.on) return;
    hbDrag.on = false;
    box.classList.remove("dragging");
    hbMove(0);
    var dx = hbDrag.dx;
    if (dx <= -HB_SWIPE_MIN) hbGo((hbIndex + 1) % BANNERS.length);
    else if (dx >= HB_SWIPE_MIN) hbGo((hbIndex - 1 + BANNERS.length) % BANNERS.length);
    else hbStart();                      // 没到阈值：仅恢复自动播放
    hbDrag.dx = 0;
  }
  box.addEventListener("pointerup", endDrag);
  box.addEventListener("pointercancel", endDrag);
  box.addEventListener("pointerleave", function (e) {
    if (hbDrag.on && e.pointerType === "mouse") endDrag(e);
  });

  // 拖动后手指抬起会补发 click，这里吃掉它，避免误跳转
  box.addEventListener("click", function (e) {
    if (hbDrag.moved) {
      e.preventDefault();
      e.stopPropagation();
      hbDrag.moved = false;
    }
  }, true);
}

function hbStart() {
  if (hbTimer) clearInterval(hbTimer);
  hbTimer = setInterval(function () {
    hbGo((hbIndex + 1) % BANNERS.length);
  }, 5200);
}

/* 离开首页时停掉定时器，回来再启动 —— 避免在别的页面空转 */
function hbPause() { if (hbTimer) { clearInterval(hbTimer); hbTimer = null; } }
function hbResume() { if (!hbTimer && route.home) hbStart(); }

/* 数据到达后刷新宫格上的数字角标（不重建 DOM，避免闪烁） */
function refreshIconNums() {
  var grid = document.getElementById("iconGrid");
  if (!grid) return;
  var flat = flatEntries();
  var nums = grid.querySelectorAll(".ig-num");
  for (var i = 0; i < nums.length; i++) {
    var idx = parseInt(nums[i].getAttribute("data-n"), 10);
    if (isNaN(idx) || !flat[idx] || !flat[idx].n) continue;
    nums[i].textContent = flat[idx].n();
  }
}

/* 典型问题处理：数据在 issues.json。
   这里放权益简报里的逐项进展 —— 比"我们做了什么"的空话有说服力得多。 */
let ISSUES = null;
let isLoaded = false;

function loadIssues() {
  if (isLoaded) return;
  isLoaded = true;
  if (typeof fetch !== "function" || location.protocol === "file:") return;
  fetch("issues.json", { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function (doc) {
      ISSUES = doc;
      var body = document.getElementById("promoBody");
      if (body) body.setAttribute("data-built", "");
      if (route.home) renderHome();
    })
    .catch(function (e) { console.error("[拾学集] 典型问题处理加载失败:", e); });
}

/* 权益工作动态：数据在 news.json。
   为什么单独放文件而不是写进 HTML：以后加了新活动（公众号发文），
   只要在 news.json 里加一条，不用碰代码。
   注意：这里的 summary 是编者自己写的概括，不是原文转载 —— 版权归原作者。 */
let NEWS = null;
let nwLoaded = false;

function loadNews() {
  if (nwLoaded) return;
  nwLoaded = true;
  if (typeof fetch !== "function" || location.protocol === "file:") return;   // 本地打开时跳过
  fetch("news.json", { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function (doc) {
      NEWS = doc;
      var body = document.getElementById("promoBody");
      if (body) body.setAttribute("data-built", "");   // 让首页重画一次，带上动态
      if (route.home) renderHome();
    })
    .catch(function (e) { console.error("[拾学集] 工作动态加载失败:", e); });
}

/* ---------- 学习路径 ---------- */
function countRefs(g) {
  let n = 0;
  for (const st of g.steps) for (const b of st.blocks) if (b.type === "resources") n += b.items.length;
  return n;
}
