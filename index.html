/* ---------- 技能自查表（勾选存 localStorage，不上传） ---------- */
const SKILL_KEY = "shixueji.skills.v1";
function loadSkillState() {
  try { return JSON.parse(localStorage.getItem(SKILL_KEY) || "{}"); } catch { return {}; }
}
function saveSkillState(s) {
  try { localStorage.setItem(SKILL_KEY, JSON.stringify(s)); } catch { /* 隐私模式下忽略 */ }
}

function renderSkills() {
  viewSkills();
}

function viewSkills() {
  viewSki.innerHTML = "";
  const state = loadSkillState();
  const all = SKILLS.reduce((a, g) => a.concat(g.items), []);
  const doneAll = all.filter((i) => state[i.id]).length;

  const head = document.createElement("div");
  head.className = "sk-head";
  const sum = document.createElement("div");
  sum.className = "sk-sum";
  sum.innerHTML = "已完成 <b>" + doneAll + "</b> / " + all.length + " 项（" +
    (all.length ? Math.round((doneAll / all.length) * 100) : 0) + "%）　·　勾选存在你自己的浏览器里，不上传、无需登录";
  head.appendChild(sum);
  if (doneAll > 0) {
    const rb = document.createElement("button");
    rb.type = "button";
    rb.className = "sk-reset";
    rb.textContent = "清空进度";
    rb.addEventListener("click", () => {
      if (confirm("确定清空所有勾选进度？此操作无法撤销。")) { saveSkillState({}); viewSkills(); }
    });
    head.appendChild(rb);
  }
  viewSki.appendChild(head);

  for (const grp of SKILLS) {
    const total = grp.items.length;
    const done = grp.items.filter((i) => state[i.id]).length;
    const box = document.createElement("div");
    box.className = "sk-group";

    const h = document.createElement("h3");
    h.appendChild(document.createTextNode(grp.title));
    const cnt = document.createElement("span");
    cnt.className = "g-cnt";
    cnt.textContent = done + " / " + total;
    h.appendChild(cnt);
    box.appendChild(h);

    const bar = document.createElement("div");
    bar.className = "sk-bar";
    const fill = document.createElement("i");
    fill.style.width = (total ? (done / total) * 100 : 0) + "%";
    bar.appendChild(fill);
    box.appendChild(bar);

    for (const it of grp.items) {
      const row = document.createElement("label");
      row.className = "sk-item" + (state[it.id] ? " done" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!state[it.id];
      const tx = document.createElement("div");
      const t1 = document.createElement("div");
      t1.className = "sk-tx";
      t1.textContent = it.text;
      tx.appendChild(t1);
      if (it.ref) {
        const rec = byTitle.get(it.ref);
        const r1 = document.createElement("div");
        r1.className = "sk-ref";
        if (rec) {
          const a = document.createElement("a");
          a.href = rec.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "参考：" + it.ref;
          a.style.color = "var(--primary)";
          a.style.textDecoration = "none";
          r1.appendChild(a);
        } else {
          r1.textContent = "参考：" + it.ref;
        }
        tx.appendChild(r1);
      }
      cb.addEventListener("change", () => {
        const s = loadSkillState();
        if (cb.checked) s[it.id] = 1; else delete s[it.id];
        saveSkillState(s);
        viewSkills();
      });
      row.appendChild(cb);
      row.appendChild(tx);
      box.appendChild(row);
    }
    viewSki.appendChild(box);
  }
}

/* ===== 资源数据加载 =====
   以 resources.json 为准；加载成功则原地替换内嵌数据并重绘。
   file:// 打开（fetch 不可用）或网络异常时静默降级，继续用内嵌数据，
   因此页面在任何情况下都有内容可显示。
   注意：指南与技能表目前只用内嵌数据（它们不常变，内嵌可保证离线可用）。

   ⚠️ 这里有一道必要的防护：远端 resources.json 可能被 CDN 或浏览器缓存成【旧版本】。
   旧数据的条目与当前内嵌数据对不上，如果直接覆盖索引，就会出现
   「点任何卡片都打开同一条 / 详情标题空白」这类诡异现象。
   因此覆盖前必须比对：远端数据是否覆盖了内嵌数据的每一条。
   若不覆盖，说明它已过期 —— 保留内嵌数据（卡片本来就用它渲染，天然一致）。 */
function coversEmbedded(list) {
  const remote = new Set();
  for (const r of list) if (r && r.title) remote.add(r.title);
  const embeddedNames = [];
  for (const r of RESOURCES) embeddedNames.push(r.name);
  const missing = [];
  for (const n of embeddedNames) if (!remote.has(n)) missing.push(n);
  return { ok: missing.length === 0, missing: missing };
}

/* 字段名归一化 —— 这是一处曾经导致线上事故的缺陷，务必保留。
   原因：resources.json 里的字段名是 title（规范要求），而内嵌数据与渲染代码用的是 name。
   两者只有在"fetch 成功、用远端数据覆盖内存"之后才会同时出现，
   于是 render() 里的 r.name 变成 undefined，卡片标题直接显示成 "undefined"。
   这里统一补齐两种字段名，使两套数据无论以何种顺序进入都不会再出问题。 */
function normalizeRecord(r) {
  if (!r) return r;
  const o = Object.assign({}, r);
  if (o.name === undefined) o.name = o.title;
  if (o.title === undefined) o.title = o.name;
  if (typeof o.free !== "boolean") o.free = !!o.free;
  if (!o.category) o.category = "未分类";
  if (!Array.isArray(o.tags)) o.tags = [];
  return o;
}

function applyResources(list) {
  if (!Array.isArray(list) || !list.length) return false;
  const cover = coversEmbedded(list);
  if (!cover.ok) {
    // 远端数据比页面旧，不足以覆盖当前卡片 —— 宁可不用它，也不能让索引错位。
    console.warn("[拾学集] resources.json 版本落后于页面，已忽略。缺少 " +
      cover.missing.length + " 条，例如：" + cover.missing.slice(0, 3).join("、"));
    return false;
  }
  RESOURCES.length = 0;
  for (const r of list) RESOURCES.push(normalizeRecord(r));
  rebuildTitleIndex();
  updateStats();
  refreshIconNums();
  renderSubchips();
  render();
  if (route.sub === "guides") renderGuides();
  if (route.sub === "skills") viewSkills();
  return true;
}

function loadResources() {
  if (typeof fetch !== "function" || location.protocol === "file:") return;
  // cache: "no-store" —— resources.json 与 index.html 是分开缓存的，
  // 一旦出现"旧数据 + 新页面"的错配，就会引发卡片标题异常、索引错位等诡异问题。
  // 这个文件很小（百余 KB），每次重新取最稳妥。
  fetch("resources.json", { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function (doc) { applyResources(doc && doc.resources); })
    .catch(function () { /* 静默降级到内嵌数据 */ });
}

// 内嵌数据也归一化一次，确保它与远端数据在任何使用顺序下都带齐 name/title
for (let i = 0; i < RESOURCES.length; i++) RESOURCES[i] = normalizeRecord(RESOURCES[i]);

rebuildTitleIndex();
/* ===================================================================
   历年试卷（1580 份）
   目的：把整理好的历年期中/期末试卷做成站内可搜索、可筛选的索引。
   为什么只做索引不放文件：全部 PDF 有 1.15 GB，GitHub Pages 放不下
   （官方限制：仓库与站点各不超过 1 GB）。所以这里只存元数据，
   文件放在源站与 GitCode 镜像上，点击直接下载。
   =================================================================== */
let EXAMS = null;             // { total, cats, courses, items, repo }
let exLoaded = false;
let exSortDesc = true;        // 默认年份倒序（最新的在最上面）

function loadExams() {
  if (exLoaded) return;
  exLoaded = true;
  if (typeof fetch !== "function" || location.protocol === "file:") {
    renderExamsError("本地打开（file://）时无法载入试卷索引，请通过网站访问。");
    return;
  }
  fetch("exams.json", { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function (doc) {
      EXAMS = doc;
      setStat("examStat", doc.total);
      refreshIconNums();
      renderModebar();
      if (route.sub === "exams") renderExams();
    })
    .catch(function (e) {
      // 打印真实错误：把渲染异常和网络失败混在一起会导致"页面空白但不知为何"
      console.error("[拾学集] 试卷索引加载失败:", e);
      renderExamsError("试卷索引加载失败，请刷新重试。");
    });
}

function renderExamsError(msg) {
  viewExa.innerHTML = "";
  const p = document.createElement("p");
  p.className = "empty";
  p.textContent = msg;
  viewExa.appendChild(p);
}

/* 试卷的检索文本：课程 + 科目 + 年份 + 类型 + 老师 + 文件名。
   课程与年份是最主要的检索入口（"数学分析A1 2024"）。 */
function examText(it) {
  return [
    EXAMS.courses[it.k] || "",
    EXAMS.cats[it.c] || "",
    it.y || "", it.s || "", it.t || "", it.h || "",
    it.n || "",
  ].join(" ").toLowerCase();
}

function renderExams() {
  if (!EXAMS) {
    if (!exLoaded) loadExams();
    // 数据还没到：显示载入中。
    // ⚠️ 这里必须让容器内容与"已就绪"状态可区分 —— 否则数据到达后，
    //    renderExams 会看到容器里已有节点就以为"控件已建好"，跳过建控件，
    //    于是页面永远卡在"正在载入"。这是实际踩过的 bug。
    if (!viewExa.querySelector(".ex-loading")) {
      viewExa.innerHTML = "";
      const p = document.createElement("p");
      p.className = "empty ex-loading";
      p.textContent = "正在载入试卷索引…";
      viewExa.appendChild(p);
    }
    return;
  }
  // 数据已就绪：确保控件建好（首次进入时建；之后复用，避免输入时丢焦点）
  let bar = viewExa.querySelector(".ex-bar");
  if (!bar) {
    viewExa.innerHTML = "";
    bar = document.createElement("div");
    bar.className = "ex-bar";

    const inp = document.createElement("input");
    inp.type = "search";
    inp.id = "exQ";
    inp.placeholder = "搜索课程 / 年份 / 老师，如「数学分析A1」「2024」「赵立丰」…";
    inp.setAttribute("aria-label", "搜索试卷");
    bar.appendChild(inp);

    const selCat = document.createElement("select");
    selCat.id = "exCat";
    const o0 = document.createElement("option");
    o0.value = ""; o0.textContent = "全部科目";
    selCat.appendChild(o0);
    EXAMS.cats.forEach(function (c) {
      const o = document.createElement("option");
      o.value = c; o.textContent = c;
      selCat.appendChild(o);
    });
    bar.appendChild(selCat);

    const selCourse = document.createElement("select");
    selCourse.id = "exCourse";
    bar.appendChild(selCourse);

    const sortBtn = document.createElement("button");
    sortBtn.type = "button";
    sortBtn.className = "ex-sort";
    sortBtn.id = "exSort";
    bar.appendChild(sortBtn);

    const count = document.createElement("p");
    count.className = "ex-count";
    count.id = "exCount";

    const list = document.createElement("div");
    list.className = "ex-list";
    list.id = "exList";

    viewExa.appendChild(bar);
    viewExa.appendChild(count);
    viewExa.appendChild(list);

    inp.addEventListener("input", function () { paintExams(); });
    selCat.addEventListener("change", function () { fillCourseSelect(); paintExams(); });
    selCourse.addEventListener("change", function () { paintExams(); });
    sortBtn.addEventListener("click", function () {
      exSortDesc = !exSortDesc;
      paintExams();
    });
    fillCourseSelect();
  }
  paintExams();
}

/* 课程下拉：随科目选择联动，只列出该科目下真实存在的课程 */
function fillCourseSelect() {
  const selCat = document.getElementById("exCat");
  const selCourse = document.getElementById("exCourse");
  if (!selCat || !selCourse) return;
  const cat = selCat.value;
  const keep = selCourse.value;
  selCourse.innerHTML = "";
  const o0 = document.createElement("option");
  o0.value = ""; o0.textContent = "全部课程";
  selCourse.appendChild(o0);

  const seen = new Set();
  for (const it of EXAMS.items) {
    if (cat && EXAMS.cats[it.c] !== cat) continue;
    const name = EXAMS.courses[it.k];
    if (!name || seen.has(name)) continue;
    seen.add(name);
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    selCourse.appendChild(o);
  }
  // 尽量保留原来的选择
  if (keep && seen.has(keep)) selCourse.value = keep;
}

function paintExams() {
  const list = document.getElementById("exList");
  const countEl = document.getElementById("exCount");
  const sortBtn = document.getElementById("exSort");
  if (!list || !countEl) return;

  const inp = document.getElementById("exQ");
  const selCat = document.getElementById("exCat");
  const selCourse = document.getElementById("exCourse");
  const kw = inp ? inp.value.trim().toLowerCase() : "";
  const cat = selCat ? selCat.value : "";
  const course = selCourse ? selCourse.value : "";
  const terms = splitQuery(kw);

  let rows = EXAMS.items.filter(function (it) {
    if (cat && EXAMS.cats[it.c] !== cat) return false;
    if (course && EXAMS.courses[it.k] !== course) return false;
    if (terms.length) {
      const txt = examText(it);
      // 多关键词：每个词都要在检索文本里出现
      for (const t of terms) if (txt.indexOf(t.toLowerCase()) === -1) return false;
    }
    return true;
  });

  // 排序：年份优先（题面里的"按时间排好序"）。
  // ⚠️ 年份缺失的必须显式排到最后 —— 早先用 (y || "0") 代替，
  //    而 "0" 小于 "2026"，导致"年份未知"在降序时跑到最前面。
  rows = rows.slice().sort(function (a, b) {
    const aHas = !!(a.y && /^\d{4}$/.test(a.y));
    const bHas = !!(b.y && /^\d{4}$/.test(b.y));
    if (aHas !== bHas) return aHas ? -1 : 1;
    let cmp = 0;
    if (aHas) {
      const ya = a.y + (a.s || "");
      const yb = b.y + (b.s || "");
      cmp = ya < yb ? -1 : (ya > yb ? 1 : 0);
    }
    if (cmp === 0) cmp = (EXAMS.courses[a.k] || "").localeCompare(EXAMS.courses[b.k] || "", "zh");
    if (cmp === 0) cmp = (a.t || "").localeCompare(b.t || "", "zh");
    return exSortDesc ? -cmp : cmp;
  });

  if (sortBtn) sortBtn.textContent = exSortDesc ? "年份 ↓ 最新优先" : "年份 ↑ 最早优先";
  countEl.textContent = "";
  const b = document.createElement("b");
  b.textContent = String(rows.length);
  countEl.appendChild(document.createTextNode("找到 "));
  countEl.appendChild(b);
  countEl.appendChild(document.createTextNode(
    " 份试卷" + (rows.length < EXAMS.items.length ? "（共 " + EXAMS.items.length + " 份）" : "")));

  list.innerHTML = "";
  // 一次只渲染前 300 条，避免 1500+ 行同时入 DOM 造成卡顿；滚动到底再补
  paintExamRows(list, rows.slice(0, 300));
  if (rows.length > 300) {
    const more = document.createElement("p");
    more.className = "ex-count";
    more.style.textAlign = "center";
    more.textContent = "已显示前 300 条 —— 用上面的搜索或筛选缩小范围";
    list.appendChild(more);
  }
}

function paintExamRows(list, rows) {
  const frag = document.createDocumentFragment();
  for (const it of rows) {
    const row = document.createElement("div");
    row.className = "ex-row";

    const y = document.createElement("span");
    y.className = "ex-year";
    y.textContent = (it.y || "年份不详") + (it.s || "");
    row.appendChild(y);

    const c = document.createElement("span");
    c.className = "ex-course";
    c.textContent = EXAMS.courses[it.k] || "";
    c.title = EXAMS.cats[it.c] + (EXAMS.courses[it.k] ? " · " + EXAMS.courses[it.k] : "");
    row.appendChild(c);

    const t = document.createElement("span");
    t.className = "ex-type";
    t.textContent = it.t || "";
    row.appendChild(t);

    const h = document.createElement("span");
    h.className = "ex-teacher";
    h.textContent = it.h || "";
    row.appendChild(h);

    const n = document.createElement("span");
    n.className = "ex-name";
    n.textContent = it.n || "";
    n.title = it.n || "";
    row.appendChild(n);

    if (it.g) {
      const tag = document.createElement("span");
      tag.className = "ex-mirror";
      tag.textContent = "国内镜像";
      tag.title = "此文件托管在国内镜像仓库，下载更快";
      row.appendChild(tag);
    }

    if (it.u) {
      const a = document.createElement("a");
      a.className = "ex-go";
      a.href = it.u;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "下载";
      a.title = it.u;
      row.appendChild(a);
    } else {
      const s = document.createElement("span");
      s.className = "ex-none";
      s.textContent = "暂无链接";
      s.title = "这份试卷没有公开的下载地址（源站未单独提供）";
      row.appendChild(s);
    }
    frag.appendChild(row);
  }
  list.appendChild(frag);
}

/* ===================================================================
   权益反馈
   目的：把校内各种反馈渠道汇总成一张清单，同学遇到问题知道该找谁。
   数据在 channels.json，便于非技术人员后续维护（改标题/换链接不用碰代码）。
   每条渠道带 status：ok（已实测可访问）/ todo（待补充链接）。
   =================================================================== */
let CHANNELS = null;
let chLoaded = false;

function loadChannels() {
  if (chLoaded) return;
  chLoaded = true;
  if (typeof fetch !== "function" || location.protocol === "file:") {
    renderRightsError("本地打开（file://）时无法载入渠道数据，请通过网站访问。");
    return;
  }
  fetch("channels.json", { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function (doc) {
      // 统计"可用"条数，用于模式按钮上的数字
      let ok = 0;
      (doc.categories || []).forEach(function (c) {
        (c.channels || []).forEach(function (x) { if (x.status === "ok") ok++; });
      });
      doc.count = ok;
      var totalCh = 0;
      (doc.categories || []).forEach(function (c) { totalCh += (c.channels || []).length; });
      doc.total = totalCh;
      CHANNELS = doc;
      setStat("chanStat", ok);
      refreshIconNums();
      renderModebar();
      if (route.sub === "channels") renderRights();
    })
    .catch(function (e) {
      console.error("[拾学集] 权益渠道加载失败:", e);
      renderRightsError("渠道数据加载失败，请刷新重试。");
    });
}

function renderRightsError(msg) {
  viewCha.innerHTML = "";
  const p = document.createElement("p");
  p.className = "empty";
  p.textContent = msg;
  viewCha.appendChild(p);
}

function renderRights() {
  if (!CHANNELS) {
    if (!chLoaded) loadChannels();
    if (!viewCha.querySelector(".rt-loading")) {
      viewCha.innerHTML = "";
      const p = document.createElement("p");
      p.className = "empty rt-loading";
      p.textContent = "正在载入反馈渠道…";
      viewCha.appendChild(p);
    }
    return;
  }
  if (viewCha.querySelector(".rt-intro")) return;   // 已渲染过，不重复构建

  viewCha.innerHTML = "";

  // 顶部说明
  const intro = document.createElement("div");
  intro.className = "rt-intro";
  intro.innerHTML =
    "遇到问题不知道找谁？这里汇总了校内的反馈渠道 —— " +
    "<b>网页、QQ 群、电话、邮箱、公众号都有</b>，按你的习惯选一个。部分渠道还在收集中，已标注「待补充」。";
  viewCha.appendChild(intro);

  // 按分类渲染
  for (const cat of CHANNELS.categories || []) {
    const box = document.createElement("section");
    box.className = "rt-cat";

    const h = document.createElement("h3");
    h.textContent = cat.name;
    if (cat.desc) {
      const d = document.createElement("span");
      d.className = "rt-cat-desc";
      d.textContent = cat.desc;
      h.appendChild(d);
    }
    box.appendChild(h);

    const list = document.createElement("div");
    list.className = "rt-list";
    for (const ch of cat.channels || []) {
      const item = document.createElement("div");
      item.className = "rt-item" + (ch.status === "ok" ? "" : " todo");

      const n = document.createElement("div");
      n.className = "rt-name";
      n.textContent = ch.name;
      item.appendChild(n);

      const d = document.createElement("div");
      d.className = "rt-desc";
      d.textContent = ch.desc || "";
      item.appendChild(d);

      const foot = document.createElement("div");
      foot.className = "rt-foot";

      // 渠道有多种形态：网页链接 / QQ 号 / 电话 / 邮箱 / 公众号 / 操作说明。
      // 统一用 kind 区分，因为"点一下就跳转"只对 link 成立，QQ 号要能复制、
      // 电话要能拨号、公众号只能告诉同学去微信搜。
      var kind = ch.kind || "link";
      var val = ch.value || ch.url || "";
      var usable = ch.status === "ok" && (kind === "guide" || val);

      if (usable) {
        if (val && kind !== "guide") {
          var v = document.createElement("span");
          v.className = "rt-val";
          v.textContent = val;
          v.title = val;
          foot.appendChild(v);
        }
        var sp0 = document.createElement("span");
        sp0.className = "rt-flex";
        foot.appendChild(sp0);

        if (kind === "link") {
          var a = document.createElement("a");
          a.className = "rt-go";
          a.href = val;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "去反馈";
          a.title = val;
          foot.appendChild(a);
        } else if (kind === "phone") {
          var tel = document.createElement("a");
          tel.className = "rt-go";
          tel.href = "tel:" + String(val).replace(/[^0-9+]/g, "");
          tel.textContent = "拨号";
          foot.appendChild(tel);
        } else if (kind === "email") {
          var ml = document.createElement("a");
          ml.className = "rt-go";
          ml.href = "mailto:" + val;
          ml.textContent = "发邮件";
          foot.appendChild(ml);
        } else if (kind === "qq") {
          var cp = document.createElement("button");
          cp.type = "button";
          cp.className = "rt-go";
          cp.textContent = "复制 QQ 号";
          cp.addEventListener("click", function (ev) {
            ev.preventDefault();
            var txt = String(val);
            if (typeof navigator !== "undefined" && navigator.clipboard) {
              navigator.clipboard.writeText(txt).then(function () { cp.textContent = "已复制"; });
            } else {
              cp.textContent = "已复制";
            }
          });
          foot.appendChild(cp);
        } else if (kind === "wechat") {
          var wx = document.createElement("span");
          wx.className = "rt-wx";
          wx.textContent = "微信里搜索关注";
          foot.appendChild(wx);
        }
      } else {
        var w = document.createElement("span");
        w.className = "rt-wait";
        w.textContent = val ? "暂不可用" : "待补充链接";
        w.title = "确认后会补上";
        foot.appendChild(w);
        var sp1 = document.createElement("span");
        sp1.className = "rt-flex";
        foot.appendChild(sp1);
      }
      item.appendChild(foot);
      list.appendChild(item);
    }
    box.appendChild(list);
    viewCha.appendChild(box);
  }
}



// 路由：hash 变化就重新渲染（支持浏览器前进/后退与直接打开深链接）
window.addEventListener("hashchange", applyMode);
renderModebar();
applyMode();
loadResources();

/* 首屏之后预取试卷与渠道数据。
   两个原因：① 首页统计要显示"历年试卷 / 反馈渠道"的数量，不预取就是一直显示"—"，
   看起来像页面坏了；② 预取后切到这两个视图不用等。
   用 setTimeout 延后，避免和首屏的资源列表抢带宽。 */
setTimeout(function () {
  loadExams();
  loadChannels();
  loadNews();
  loadIssues();
}, 400);
</script>
