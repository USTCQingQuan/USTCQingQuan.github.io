<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="拾学集:为中科大同学精选的网络学习资源,覆盖 AI 与数据科学、课程资料、视频课程、编程开发、学术科研、校内平台、效率工具、竞赛信息、校园信息与英语备考。" />
<title>拾学集 · 中科大学习资源</title>
<style>
  :root {
    --bg: #f7f4ec;
    --card: #ffffff;
    --ink: #22302b;
    --muted: #71827b;
    --primary: #175e4c;
    --primary-deep: #0e4437;
    --accent: #e8b04b;
    --border: #e8e2d3;
    --c-kecheng: #2e7d5b;
    --c-shipin: #b4552d;
    --c-biancheng: #35579b;
    --c-xueshu: #6d4c9f;
    --c-xiaonei: #0e7490;
    --c-xiaolv: #a16207;
    --c-jingsai: #b91c1c;
    --c-xiaoyuan: #be185d;
    --c-yingyu: #4d7c0f;
    --c-ai: #1d4ed8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

  /* ===== Hero ===== */
  .hero {
    position: relative; overflow: hidden;
    background:
      radial-gradient(1100px 420px at 85% -10%, rgba(232, 176, 75, 0.28), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(46, 125, 91, 0.35), transparent 55%),
      linear-gradient(135deg, #103c31 0%, #175e4c 55%, #1d6b57 100%);
    color: #f3f0e6;
    padding: 72px 0 88px;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, #000 30%, transparent 75%);
  }
  .hero .wrap { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: 2px; color: #cfe3d9;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    padding: 6px 16px; margin-bottom: 22px; backdrop-filter: blur(4px);
  }
  .hero-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .hero h1 {
    font-size: clamp(38px, 6vw, 60px); font-weight: 800; letter-spacing: 4px; line-height: 1.15;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p.sub {
    margin-top: 16px; max-width: 560px; font-size: 16px; color: #c6d8cf;
  }
  .hero-stats { display: flex; gap: 36px; margin-left: auto; padding-bottom: 6px; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 30px; font-weight: 800; color: #fff; }
  .stat span { font-size: 13px; color: #b9cec3; letter-spacing: 1px; }

  /* ===== Sticky toolbar ===== */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(247, 244, 236, 0.88); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 6px 24px rgba(34, 48, 43, 0.05);
    padding: 14px 0;
  }
  .toolbar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search {
    position: relative; flex: 1 1 240px; max-width: 340px;
  }
  .search svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; stroke: var(--muted);
  }
  .search input {
    width: 100%; padding: 10px 16px 10px 38px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--card); color: var(--ink); outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23, 94, 76, 0.12); }
  .chip {
    padding: 8px 18px; border-radius: 999px; font-size: 14px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--ink); cursor: pointer; transition: all .18s;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
  .chip.active {
    background: var(--primary); border-color: var(--primary); color: #fff;
    box-shadow: 0 4px 14px rgba(23, 94, 76, 0.3);
  }
  .free-toggle {
    margin-left: auto; font-size: 14px; color: var(--muted);
    display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
  }
  .free-toggle input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }

  /* ===== Cards ===== */
  main { padding: 36px 0 56px; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    position: relative; display: block; overflow: hidden;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px 22px 18px;
    text-decoration: none; color: inherit;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    animation: rise .5s ease both;
  }
  .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, var(--cat-color, var(--primary)), transparent 80%);
    opacity: 0; transition: opacity .22s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(23, 94, 76, 0.35);
    box-shadow: 0 16px 40px rgba(34, 48, 43, 0.12);
  }
  .card:hover::after { opacity: 1; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-head { display: flex; align-items: center; gap: 13px; }
  .card-icon {
    width: 46px; height: 46px; flex: none; border-radius: 13px;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: color-mix(in srgb, var(--cat-color, var(--primary)) 12%, #fff);
    border: 1px solid color-mix(in srgb, var(--cat-color, var(--primary)) 22%, #fff);
  }
  .card-name { font-size: 16.5px; font-weight: 700; letter-spacing: .3px; }
  .card-jump {
    margin-left: auto; flex: none; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; border: 1px solid var(--border);
    transition: all .2s;
  }
  .card:hover .card-jump {
    background: var(--primary); border-color: var(--primary); color: #fff;
    transform: rotate(45deg);
  }
  .card-desc { margin-top: 12px; font-size: 13.5px; color: var(--muted); min-height: 44px; }
  .card-foot { margin-top: 14px; display: flex; gap: 8px; }
  .badge { font-size: 12px; padding: 3px 11px; border-radius: 999px; letter-spacing: .3px; }
  .badge.cat {
    color: var(--cat-color, var(--primary));
    background: color-mix(in srgb, var(--cat-color, var(--primary)) 10%, #fff);
  }
  .badge.free { background: #e2f0e8; color: #17603f; }
  .badge.paid { background: #f8ecd8; color: #96660f; }
  .empty { text-align: center; color: var(--muted); padding: 72px 0; font-size: 15px; }

  footer {
    border-top: 1px solid var(--border); padding: 30px 0 46px;
    text-align: center; color: var(--muted); font-size: 13px;
  }
  footer b { color: var(--primary); letter-spacing: 1px; }

  /* ===== 二级子分类 ===== */
  #subchips {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding-top: 10px;
  }
  #subchips[hidden] { display: none; }
  #subchips .sub-label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  #subchips .sub-chip {
    padding: 5px 13px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    cursor: pointer; transition: all .18s;
  }
  #subchips .sub-chip:hover { border-color: var(--primary); color: var(--primary); }
  #subchips .sub-chip.active {
    background: color-mix(in srgb, var(--primary) 12%, #fff);
    border-color: var(--primary); color: var(--primary-deep); font-weight: 700;
  }
  #subchips .sub-count { color: var(--muted); font-weight: 400; margin-left: 3px; }

  /* ===== 顶栏模式切换（资源库 / 学习路径 / 技能自查）===== */
  .modebar {
    border-bottom: 1px solid var(--border);
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
  }
  .modebar .wrap { display: flex; gap: 8px; padding-top: 10px; padding-bottom: 10px; }
  .mode-btn {
    padding: 8px 20px; border-radius: 999px; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    cursor: pointer; transition: all .18s;
  }
  .mode-btn:hover { color: var(--primary); border-color: var(--primary); }
  .mode-btn.active { background: var(--primary-deep); border-color: var(--primary-deep); color: #fff; }
  .mode-btn .n { font-weight: 400; opacity: .75; margin-left: 4px; }

  /* ===== 学习路径 ===== */
  .guide-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px 24px; margin-bottom: 14px; cursor: pointer; transition: all .2s;
  }
  .guide-card:hover { border-color: rgba(23,94,76,.35); box-shadow: 0 10px 28px rgba(34,48,43,.10); transform: translateY(-2px); }
  .guide-card .g-top { display: flex; align-items: center; gap: 14px; }
  .guide-card .g-icon {
    width: 46px; height: 46px; flex: none; border-radius: 13px; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--primary) 10%, #fff);
    border: 1px solid color-mix(in srgb, var(--primary) 20%, #fff);
  }
  .guide-card h3 { font-size: 17px; font-weight: 700; }
  .guide-card .g-sub { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  .guide-card .g-meta { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .guide-card .g-meta span { background: #f1efe6; padding: 3px 11px; border-radius: 999px; }

  .guide-detail { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 26px 28px; }
  .guide-detail .gd-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 6px; }
  .guide-detail h2 { font-size: 22px; font-weight: 800; }
  .guide-detail .gd-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .back-btn {
    margin-bottom: 16px; padding: 7px 16px; border-radius: 999px; font-size: 13.5px;
    border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .back-btn:hover { border-color: var(--primary); color: var(--primary); }
  .gd-step { border-top: 1px solid var(--border); padding: 22px 0 6px; }
  .gd-step:first-of-type { border-top: 0; }
  .gd-step h4 { font-size: 16px; font-weight: 700; color: var(--primary-deep); margin-bottom: 12px; display: flex; align-items: center; gap: 9px; }
  .gd-step h4 .sn {
    width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--primary); color: #fff;
    font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .gd-text { font-size: 14px; color: #3d4b45; line-height: 1.8; margin-bottom: 14px; }
  .gd-res { list-style: none; margin-bottom: 14px; }
  .gd-res li { display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px dashed var(--border); }
  .gd-res li:last-child { border-bottom: 0; }
  .gd-res .ri { flex: none; font-size: 15px; line-height: 1.6; }
  .gd-res .rt { font-weight: 600; }
  .gd-res .rt a { color: var(--primary); text-decoration: none; }
  .gd-res .rt a:hover { text-decoration: underline; }
  .gd-res .rn { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.7; }
  .gd-ck { background: #f8f6ee; border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 6px; }
  .gd-ck b { font-size: 13px; color: var(--primary-deep); display: block; margin-bottom: 7px; }
  .gd-ck ul { list-style: none; }
  .gd-ck li { font-size: 13.5px; color: #4a5852; padding: 3px 0 3px 20px; position: relative; }
  .gd-ck li::before { content: "○"; position: absolute; left: 4px; color: var(--muted); }

  /* ===== 技能自查表 ===== */
  .sk-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .sk-head .sk-sum { font-size: 14px; color: var(--muted); }
  .sk-head .sk-sum b { color: var(--primary-deep); font-size: 17px; }
  .sk-reset { padding: 6px 14px; border-radius: 999px; font-size: 13px; border: 1px solid var(--border); background: var(--card); cursor: pointer; color: var(--muted); }
  .sk-reset:hover { border-color: #b91c1c; color: #b91c1c; }
  .sk-group { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; margin-bottom: 14px; }
  .sk-group h3 { font-size: 15.5px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
  .sk-group .g-cnt { font-size: 12.5px; color: var(--muted); font-weight: 400; }
  .sk-bar { height: 5px; background: #ece8dc; border-radius: 999px; margin: 10px 0 14px; overflow: hidden; }
  .sk-bar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .25s; }
  .sk-item { display: flex; gap: 11px; padding: 7px 0; cursor: pointer; align-items: flex-start; border-radius: 8px; }
  .sk-item:hover { background: #faf8f2; }
  .sk-item input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; flex: none; }
  .sk-item .sk-tx { font-size: 14px; line-height: 1.65; }
  .sk-item.done .sk-tx { color: var(--muted); text-decoration: line-through; }
  .sk-item .sk-ref { font-size: 12.5px; color: var(--primary); margin-top: 2px; }

  /* ===== 资源详情弹层 =====
     交互设计：卡片主体点击 -> 看详情（完整字段）；右上箭头按钮 -> 直接跳转外部站点。
     两者分开，既保留"一键直达"，又满足规范"打开资源卡片即可知道这是什么"。 */
  .card-jump { cursor: pointer; position: relative; z-index: 2; }
  body.modal-open { overflow: hidden; }
  .detail-mask {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(24, 34, 30, 0.5);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto;
  }
  .detail-mask[hidden] { display: none; }
  .detail-box {
    background: var(--card); border-radius: 20px; width: 100%; max-width: 660px;
    box-shadow: 0 24px 70px rgba(15, 30, 25, 0.35);
    padding: 26px 28px 22px; animation: dpop .18s ease both;
  }
  @keyframes dpop { from { opacity: 0; transform: translateY(-10px) scale(.99); } to { opacity: 1; transform: none; } }
  .dt-head { display: flex; align-items: flex-start; gap: 14px; }
  .dt-icon {
    width: 52px; height: 52px; flex: none; border-radius: 15px; font-size: 25px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--dt-color, var(--primary)) 12%, #fff);
    border: 1px solid color-mix(in srgb, var(--dt-color, var(--primary)) 24%, #fff);
  }
  .dt-title { font-size: 20px; font-weight: 800; line-height: 1.35; }
  .dt-sub { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .dt-close {
    margin-left: auto; flex: none; width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    font-size: 17px; cursor: pointer; line-height: 1;
  }
  .dt-close:hover { border-color: #b91c1c; color: #b91c1c; }
  .dt-desc {
    margin-top: 16px; font-size: 14.5px; line-height: 1.8; color: #3d4b45;
    background: #faf8f2; border-radius: 12px; padding: 13px 16px;
  }
  .dt-tags { margin-top: 13px; display: flex; flex-wrap: wrap; gap: 7px; }
  .dt-tags span {
    font-size: 12.5px; padding: 3px 11px; border-radius: 999px;
    background: color-mix(in srgb, var(--dt-color, var(--primary)) 10%, #fff);
    color: var(--dt-color, var(--primary));
    border: 1px solid color-mix(in srgb, var(--dt-color, var(--primary)) 22%, #fff);
  }
  .dt-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  .dt-go {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--primary); color: #fff; text-decoration: none;
    padding: 10px 22px; border-radius: 999px; font-size: 14.5px; font-weight: 600;
    transition: background .18s;
  }
  .dt-go:hover { background: var(--primary-deep); }
  .dt-copy {
    padding: 10px 18px; border-radius: 999px; font-size: 14px;
    border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .dt-copy:hover { border-color: var(--primary); color: var(--primary); }
  .dt-report {
    padding: 10px 18px; border-radius: 999px; font-size: 14px;
    border: 1px dashed var(--border); background: transparent; color: var(--muted); cursor: pointer;
  }
  .dt-report:hover { border-color: var(--accent); color: #a16207; background: #fffbef; }
  .dt-hint {
    margin-top: 9px; font-size: 12.5px; color: var(--muted); line-height: 1.7;
  }
  .dt-hint.ok { color: var(--primary); }
  .dt-url {
    margin-top: 12px; font-size: 12.5px; color: var(--muted);
    word-break: break-all; font-family: ui-monospace, Consolas, monospace;
  }
  .dt-section { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
  .dt-section > h5 {
    font-size: 12.5px; font-weight: 700; color: var(--primary-deep);
    letter-spacing: .5px; margin-bottom: 10px;
  }
  .dt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 20px; }
  .dt-row { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; }
  .dt-row .k { color: var(--muted); flex: none; min-width: 88px; }
  .dt-row .v { color: var(--ink); }
  .dt-row .v.no { color: #9a8f7d; }
  .dt-row .v.yes { color: var(--primary); font-weight: 600; }
  .dt-note {
    margin-top: 16px; font-size: 12.5px; color: var(--muted); line-height: 1.75;
    background: #f6f4ec; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    padding: 10px 14px;
  }
  @media (max-width: 640px) {
    .detail-mask { padding: 16px 12px; }
    .detail-box { padding: 20px 18px 18px; border-radius: 16px; }
    .dt-grid { grid-template-columns: 1fr; }
    .dt-title { font-size: 17.5px; }
    .dt-actions .dt-go, .dt-actions .dt-copy { flex: 1 1 auto; justify-content: center; }
  }

  @media (max-width: 720px) {
    .hero { padding: 52px 0 64px; }
    .hero-stats { margin-left: 0; gap: 28px; }
    .search { max-width: none; flex-basis: 100%; }
    .free-toggle { margin-left: 0; }
    #subchips .sub-chip { font-size: 12px; padding: 4px 11px; }
    .modebar .wrap { gap: 6px; }
    .mode-btn { padding: 7px 14px; font-size: 13px; flex: 1 1 auto; text-align: center; }
    .guide-detail { padding: 20px 18px; }
    .gd-res li { gap: 8px; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="wrap">
    <div>
      <span class="hero-badge">USTC LEARNING HUB</span>
      <h1>拾<em>学</em>集</h1>
      <p class="sub">为中科大同学精选的网络学习资源——AI 与数据科学、课程资料、视频课程、编程开发、学术科研、校内平台、效率工具、竞赛信息、校园信息与英语备考,一站式直达。</p>
    </div>
    <div class="hero-stats">
      <div class="stat"><b id="total"></b><span>精选资源</span></div>
      <div class="stat"><b id="catCount"></b><span>个分类</span></div>
      <div class="stat"><b id="freeCount"></b><span>免费</span></div>
    </div>
  </div>
</section>

<div class="toolbar">
  <div class="wrap" id="chips">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
      <input id="q" type="search" placeholder="搜索资源名称或简介…" aria-label="搜索资源" />

let activeCategory = "全部";
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");

// 顶部统计数字统一由这里更新：分类数从 CATEGORIES 现算，
// 避免"新增分类后 Hero 区还写着旧数字"（原先硬编码为 9）。
function updateStats() {
  document.getElementById("total").textContent = RESOURCES.length;
  document.getElementById("catCount").textContent = CATEGORIES.length - 1; // 减去"全部"
  document.getElementById("freeCount").textContent = RESOURCES.filter((r) => r.free).length;
}

updateStats();

// ===== 二级筛选：选中大类后，在其下方显示该大类的子分类 =====
// 设计：大类仍是第一层，子分类只在大类被选中时出现，避免首页一次显示 52 个标签。
const subchips = document.getElementById("subchips");
let activeSub = "";

function renderSubchips() {
  subchips.innerHTML = "";
  if (activeCategory === "全部") { subchips.hidden = true; return; }

  const inCat = RESOURCES.filter((r) => r.category === activeCategory);
  const subs = [];
  for (const r of inCat) if (r.subcategory && !subs.includes(r.subcategory)) subs.push(r.subcategory);

  if (subs.length <= 1) { subchips.hidden = true; return; }  // 只有一个子分类就不必显示
  subchips.hidden = false;

  const label = document.createElement("span");
  label.className = "sub-label";
  label.textContent = "子分类：";
  subchips.appendChild(label);

  const mk = (name, count) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sub-chip" + (activeSub === name ? " active" : "");
    b.textContent = name;
    if (count !== undefined) {
      const s = document.createElement("span");
      s.className = "sub-count";
      s.textContent = "(" + count + ")";
      b.appendChild(s);
    }
    b.addEventListener("click", () => {
      activeSub = (name === "全部" ? "" : name);
      renderSubchips();
      render();
    });
    return b;
  };

  subchips.appendChild(mk("全部", inCat.length));
  for (const s of subs) subchips.appendChild(mk(s, inCat.filter((r) => r.subcategory === s).length));
}

for (const cat of CATEGORIES) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "chip" + (cat === activeCategory ? " active" : "");
  btn.textContent = cat;
  btn.addEventListener("click", () => {
    activeCategory = cat;
    activeSub = "";                                    // 切换大类时清空子分类
    for (const c of chips.querySelectorAll(".chip")) c.classList.toggle("active", c.textContent === cat);
    renderSubchips();
    render();
  });
  chips.insertBefore(btn, chips.querySelector(".free-toggle"));
}

function searchText(r) {
  // 检索范围：名称 + 简介 + 标签 + 分类 + 来源站点。
  // 标签参与检索是"标签搜索"的基础；分类与来源一起纳入，方便直接搜"论文""镜像站""校内平台"。
  return [
    r.name,
    r.description,
    (r.tags || []).join(" "),
    r.category,
    r.source || "",
  ].join(" ").toLowerCase();
}

function render() {
  const keyword = q.value.trim().toLowerCase();
  const list = RESOURCES.filter((r) => {
    if (activeCategory !== "全部" && r.category !== activeCategory) return false;
    if (activeSub && r.subcategory !== activeSub) return false;
    if (freeOnly.checked && !r.free) return false;
    if (keyword && !searchText(r).includes(keyword)) return false;
    return true;
  });
  grid.innerHTML = "";
  list.forEach((r, i) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute("data-title", r.name);
    a.style.setProperty("--cat-color", CAT_COLORS[r.category] || "var(--primary)");
    a.style.animationDelay = Math.min(i * 35, 400) + "ms";
    a.innerHTML =
      '<div class="card-head"><span class="card-icon">' + r.icon + '</span>' +
      '<span class="card-name"></span><span class="card-jump" title="直接打开网站">↗</span></div>' +
      '<p class="card-desc"></p>' +
      '<div class="card-foot"><span class="badge cat">' + r.category + "</span>" +
      (r.free ? '<span class="badge free">免费</span>' : '<span class="badge paid">付费/部分免费</span>') +
      "</div>";
    a.querySelector(".card-name").textContent = r.name;
    a.querySelector(".card-desc").textContent = r.description;
    // 卡片主体 -> 打开详情；右上箭头 -> 直接跳转（阻止冒泡以免同时弹层）
    const jump = a.querySelector(".card-jump");
    if (jump) jump.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      window.open(r.url, "_blank", "noopener,noreferrer");
    });
    a.addEventListener("click", (ev) => {
      ev.preventDefault();          // 卡片主体不再直接跳转，改为看详情
      openDetail(r.name);
    });
    grid.appendChild(a);
  });
  empty.hidden = list.length > 0;
}

const detailMask = document.getElementById("detail-mask");
const detailBox = document.getElementById("detail-box");
let lastFocus = null;

// 把资源记录里的字段拆成"能直接展示"和"未核验"两类
const FIELD_KEYS = [

];

function isUnknown(v) {
  if (v === undefined || v === null) return true;
  const s = String(v).trim();
  return s === "" || s === "未核验" || s === "待复核";
}

function openDetail(title) {
  const r = byTitle.get(title);
  if (!r) return;
  lastFocus = document.activeElement;
  detailBox.innerHTML = "";
  detailBox.style.setProperty("--dt-color", CAT_COLORS[r.category] || "var(--primary)");

  // 头部
  const head = document.createElement("div");
  head.className = "dt-head";
  head.innerHTML =
    '<span class="dt-icon"></span>' +
    '<div style="min-width:0"><div class="dt-title"></div><div class="dt-sub"></div></div>' +
    '<button type="button" class="dt-close" aria-label="关闭">✕</button>';
  head.querySelector(".dt-icon").textContent = r.icon || "•";
  head.querySelector(".dt-title").textContent = r.name;
  head.querySelector(".dt-sub").textContent = r.category + (r.subcategory ? " · " + r.subcategory : "");
  head.querySelector(".dt-close").addEventListener("click", closeDetail);
  detailBox.appendChild(head);

  // 简介
  const desc = document.createElement("p");
  desc.className = "dt-desc";
  desc.textContent = r.description || "";
  detailBox.appendChild(desc);

  // 标签
  if (Array.isArray(r.tags) && r.tags.length) {
    const tw = document.createElement("div");
    tw.className = "dt-tags";
    for (const t of r.tags) {
      const s = document.createElement("span");
      s.textContent = t;
      tw.appendChild(s);
    }
    detailBox.appendChild(tw);
  }

  // 操作
  const acts = document.createElement("div");
  acts.className = "dt-actions";
  const go = document.createElement("a");
  go.className = "dt-go";
  go.href = r.url;
  go.target = "_blank";
  go.rel = "noopener noreferrer";
  go.textContent = "前往网站 ↗";
  acts.appendChild(go);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    const cp = document.createElement("button");
    cp.type = "button";
    cp.className = "dt-copy";
    cp.textContent = "复制链接";
    cp.addEventListener("click", () => {
      navigator.clipboard.writeText(r.url).then(() => {
        cp.textContent = "已复制 ✓";
        setTimeout(() => { cp.textContent = "复制链接"; }, 1600);
      }).catch(() => { cp.textContent = "复制失败"; });
    });
    acts.appendChild(cp);
  }

  // 报告问题：把资源信息复制到剪贴板，再打开反馈问卷。
  // 为什么用"复制 + 打开"而不是直接拼 URL 参数：
  // 腾讯问卷的链接参数预填是【商业版付费功能】，免费版用不了（官方文档已注明）。
  // 所以退而求其次 —— 替用户把要填的内容准备好，他粘贴一次即可。
  const rp = document.createElement("button");
  rp.type = "button";
  rp.className = "dt-report";
  rp.textContent = "报告问题";
  acts.appendChild(rp);
  detailBox.appendChild(acts);

  const hint = document.createElement("p");
  hint.className = "dt-hint";
  hint.textContent = "发现链接打不开、简介或分类有误、使用条件与实际不符？点「报告问题」即可反馈。";
  detailBox.appendChild(hint);

  rp.addEventListener("click", () => {
    const payload = r.name + "\n" + r.url + "\n" + r.category + (r.subcategory ? " · " + r.subcategory : "");
    const openForm = () => {
      window.open(FEEDBACK_FORM_URL, "_blank", "noopener,noreferrer");
      hint.classList.add("ok");
      hint.textContent = "已复制本条资源信息，粘贴到问卷即可（Ctrl+V）。感谢反馈！";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload).then(openForm).catch(() => {
        window.open(FEEDBACK_FORM_URL, "_blank", "noopener,noreferrer");
        hint.textContent = "已打开问卷。请手动填写资源名称：「" + r.name + "」。";
      });
    } else {
      window.open(FEEDBACK_FORM_URL, "_blank", "noopener,noreferrer");
      hint.textContent = "已打开问卷。请手动填写资源名称：「" + r.name + "」。";
    }
  });

  const url = document.createElement("div");
  url.className = "dt-url";
  url.textContent = r.url;
  detailBox.appendChild(url);

  // 字段明细
  const sec = document.createElement("div");
  sec.className = "dt-section";
  const h5 = document.createElement("h5");
  h5.textContent = "使用条件";
  sec.appendChild(h5);
  const g = document.createElement("div");
  g.className = "dt-grid";
  let unknownCount = 0;
  for (const [key, label] of FIELD_KEYS) {
    const row = document.createElement("div");
    row.className = "dt-row";
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = label;
    const v = document.createElement("span");
    v.className = "v";
    const val = r[key];
    if (isUnknown(val)) {
      v.classList.add("no");
      v.textContent = "未核验";
      unknownCount++;
    } else if (key === "cost") {
      v.classList.add("yes");
      v.textContent = String(val);
    } else {
      v.textContent = String(val);
    }
    row.appendChild(k);
    row.appendChild(v);
    g.appendChild(row);
  }
  sec.appendChild(g);
  detailBox.appendChild(sec);

  // 未核验提示：如实说明，不假装数据完整
  if (unknownCount > 0) {
    const note = document.createElement("p");
    note.className = "dt-note";
    note.textContent = "上表中 " + unknownCount + " 个字段尚未经人工核验（注册要求、网络要求、学生身份等）。" +
      "我们不对未核实的使用条件做猜测——如果你实测过，欢迎反馈更正。";
    detailBox.appendChild(note);
  }

  detailMask.hidden = false;
  document.body.classList.add("modal-open");
  const closeBtn = detailBox.querySelector(".dt-close");
  if (closeBtn && closeBtn.focus) closeBtn.focus();
}

function closeDetail() {
  detailMask.hidden = true;
  detailBox.innerHTML = "";
  document.body.classList.remove("modal-open");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

// 点遮罩空白处关闭（点内容区不关）
detailMask.addEventListener("click", (ev) => { if (ev.target === detailMask) closeDetail(); });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !detailMask.hidden) closeDetail();
});

q.addEventListener("input", render);
freeOnly.addEventListener("change", render);
render();

/* ===================================================================
   模式切换：资源库 / 学习路径 / 技能自查
   设计取舍：用同一份数据的不同"视图"，不做多页面跳转，保持单文件可离线。
   =================================================================== */
const modebar = document.getElementById("modebar");
const viewRes = document.getElementById("view-resources");
const viewGui = document.getElementById("view-guides");
const viewSki = document.getElementById("view-skills");
const toolbar = document.querySelector(".toolbar");

const MODES = [
  { id: "resources", label: "资源库", n: () => RESOURCES.length },
  { id: "guides", label: "学习路径", n: () => GUIDES.length },
  { id: "skills", label: "技能自查", n: () => SKILLS.reduce((s, g) => s + g.items.length, 0) },
];
let activeMode = "resources";
let activeGuide = null;

const byTitle = new Map();
function rebuildTitleIndex() {
  byTitle.clear();
  for (const r of RESOURCES) byTitle.set(r.name, r);
}

function renderModebar() {
  modebar.innerHTML = "";
  for (const m of MODES) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mode-btn" + (activeMode === m.id ? " active" : "");
    b.textContent = m.label;
    const sp = document.createElement("span");
    sp.className = "n";
    sp.textContent = m.n();
    b.appendChild(sp);
    b.addEventListener("click", () => {
      activeMode = m.id;
      if (m.id !== "guides") activeGuide = null;
      applyMode();
    });
    modebar.appendChild(b);
  }
}

function applyMode() {
  viewRes.hidden = activeMode !== "resources";
  viewGui.hidden = activeMode !== "guides";
  viewSki.hidden = activeMode !== "skills";
  // 资源筛选栏只在资源库模式下有意义
  if (toolbar) toolbar.hidden = activeMode !== "resources";
  renderModebar();
  if (activeMode === "guides") renderGuides();
  if (activeMode === "skills") renderSkills();
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* ---------- 学习路径 ---------- */
function countRefs(g) {
  let n = 0;
  for (const st of g.steps) for (const b of st.blocks) if (b.type === "resources") n += b.items.length;
  return n;
}

function renderGuides() {
  viewGui.innerHTML = "";
  if (activeGuide) return renderGuideDetail(activeGuide);

  const intro = document.createElement("p");
  intro.className = "gd-text";
  intro.style.marginBottom = "18px";
  intro.textContent = "把已收录的资源编排成能照着走的路线。每条路径按阶段列出该用什么、为什么现在用它，并附一份自查清单。";
  viewGui.appendChild(intro);

  for (const g of GUIDES) {
    const card = document.createElement("div");
    card.className = "guide-card";
    card.innerHTML =
      '<div class="g-top"><span class="g-icon"></span><div>' +
      '<h3></h3><p class="g-sub"></p></div></div>' +
      '<div class="g-meta"><span class="m1"></span><span class="m2"></span><span class="m3"></span></div>';
    card.querySelector(".g-icon").textContent = g.icon || "📘";
    card.querySelector("h3").textContent = g.title;
    card.querySelector(".g-sub").textContent = g.subtitle || "";
    const meta = card.querySelectorAll(".g-meta span");
    meta[0].textContent = g.steps.length + " 个阶段";
    meta[1].textContent = countRefs(g) + " 个资源";
    meta[2].textContent = g.audience || "";
    card.addEventListener("click", () => { activeGuide = g.id; renderGuides(); window.scrollTo({ top: 0, behavior: "auto" }); });
    viewGui.appendChild(card);
  }
}

function renderGuideDetail(id) {
  const g = GUIDES.find((x) => x.id === id);
  if (!g) { activeGuide = null; return renderGuides(); }

  const back = document.createElement("button");
  back.type = "button";
  back.className = "back-btn";
  back.textContent = "← 返回路径列表";
  back.addEventListener("click", () => { activeGuide = null; renderGuides(); });
  viewGui.appendChild(back);

  const wrap = document.createElement("div");
  wrap.className = "guide-detail";
  const head = document.createElement("div");
  head.className = "gd-head";
  head.innerHTML = '<span class="g-icon" style="width:46px;height:46px;flex:none;border-radius:13px;font-size:22px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--primary) 10%, #fff);border:1px solid color-mix(in srgb, var(--primary) 20%, #fff)"></span><div><h2></h2><p class="gd-sub"></p></div>';
  head.querySelector(".g-icon").textContent = g.icon || "📘";
  head.querySelector("h2").textContent = g.title;
  head.querySelector(".gd-sub").textContent = (g.subtitle || "") + (g.audience ? "　·　适合：" + g.audience : "");
  wrap.appendChild(head);

  g.steps.forEach((st, si) => {
    const sec = document.createElement("div");
    sec.className = "gd-step";
    const h = document.createElement("h4");
    const sn = document.createElement("span");
    sn.className = "sn";
    sn.textContent = si + 1;
    h.appendChild(sn);
    h.appendChild(document.createTextNode(st.title));
    sec.appendChild(h);

    for (const b of st.blocks) {
      if (b.type === "text") {
        const p = document.createElement("p");
        p.className = "gd-text";
        p.textContent = b.text;
        sec.appendChild(p);
      } else if (b.type === "resources") {
        const ul = document.createElement("ul");
        ul.className = "gd-res";
        for (const raw of b.items) {
          const it = typeof raw === "string" ? { title: raw } : raw;
          const rec = byTitle.get(it.title);
          const li = document.createElement("li");
          const ri = document.createElement("span");
          ri.className = "ri";
          ri.textContent = rec ? (rec.icon || "•") : "•";
          const box = document.createElement("div");
          const rt = document.createElement("div");
          rt.className = "rt";
          if (rec) {
            const a = document.createElement("a");
            a.href = rec.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = it.title;
            rt.appendChild(a);
          } else {
            rt.textContent = it.title;   // 理论上不会发生：check-guides.mjs 会拦住
          }
          box.appendChild(rt);
          if (it.note) {
            const rn = document.createElement("div");
            rn.className = "rn";
            rn.textContent = it.note;
            box.appendChild(rn);
          }
          li.appendChild(ri);
          li.appendChild(box);
          ul.appendChild(li);
        }
        sec.appendChild(ul);
      } else if (b.type === "checklist") {
        const ck = document.createElement("div");
        ck.className = "gd-ck";
        const t = document.createElement("b");
        t.textContent = "走完这一阶段，你应该能：";
        ck.appendChild(t);
        const ul = document.createElement("ul");
        for (const s of b.items) {
          const li = document.createElement("li");
          li.textContent = s;
          ul.appendChild(li);
        }
        ck.appendChild(ul);
        sec.appendChild(ck);
      }
    }
    wrap.appendChild(sec);
  });
  viewGui.appendChild(wrap);
}

/* ---------- 技能自查表（勾选存 localStorage，不上传） ---------- */
const SKILL_KEY = "shixueji.skills.v1";
function loadSkillState() {
  try { return JSON.parse(localStorage.getItem(SKILL_KEY) || "{}"); } catch { return {}; }
}
function saveSkillState(s) {
  try { localStorage.setItem(SKILL_KEY, JSON.stringify(s)); } catch { /* 隐私模式下忽略 */ }
}

function renderSkills() {
  viewSkills();
}

function viewSkills() {
  viewSki.innerHTML = "";
  const state = loadSkillState();
  const all = SKILLS.reduce((a, g) => a.concat(g.items), []);
  const doneAll = all.filter((i) => state[i.id]).length;

  const head = document.createElement("div");
  head.className = "sk-head";
  const sum = document.createElement("div");
  sum.className = "sk-sum";
  sum.innerHTML = "已完成 <b>" + doneAll + "</b> / " + all.length + " 项（" +
    (all.length ? Math.round((doneAll / all.length) * 100) : 0) + "%）　·　勾选存在你自己的浏览器里，不上传、无需登录";
  head.appendChild(sum);
  if (doneAll > 0) {
    const rb = document.createElement("button");
    rb.type = "button";
    rb.className = "sk-reset";
    rb.textContent = "清空进度";
    rb.addEventListener("click", () => {
      if (confirm("确定清空所有勾选进度？此操作无法撤销。")) { saveSkillState({}); viewSkills(); }
    });
    head.appendChild(rb);
  }
  viewSki.appendChild(head);

  for (const grp of SKILLS) {
    const total = grp.items.length;
    const done = grp.items.filter((i) => state[i.id]).length;
    const box = document.createElement("div");
    box.className = "sk-group";

    const h = document.createElement("h3");
    h.appendChild(document.createTextNode(grp.title));
    const cnt = document.createElement("span");
    cnt.className = "g-cnt";
    cnt.textContent = done + " / " + total;
    h.appendChild(cnt);
    box.appendChild(h);

    const bar = document.createElement("div");
    bar.className = "sk-bar";
    const fill = document.createElement("i");
    fill.style.width = (total ? (done / total) * 100 : 0) + "%";
    bar.appendChild(fill);
    box.appendChild(bar);

    for (const it of grp.items) {
      const row = document.createElement("label");
      row.className = "sk-item" + (state[it.id] ? " done" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!state[it.id];
      const tx = document.createElement("div");
      const t1 = document.createElement("div");
      t1.className = "sk-tx";
      t1.textContent = it.text;
      tx.appendChild(t1);
      if (it.ref) {
        const rec = byTitle.get(it.ref);
        const r1 = document.createElement("div");
        r1.className = "sk-ref";
        if (rec) {
          const a = document.createElement("a");
          a.href = rec.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "参考：" + it.ref;
          a.style.color = "var(--primary)";
          a.style.textDecoration = "none";
          r1.appendChild(a);
        } else {
          r1.textContent = "参考：" + it.ref;
        }
        tx.appendChild(r1);
      }
      cb.addEventListener("change", () => {
        const s = loadSkillState();
        if (cb.checked) s[it.id] = 1; else delete s[it.id];
        saveSkillState(s);
        viewSkills();
      });
      row.appendChild(cb);
      row.appendChild(tx);
      box.appendChild(row);
    }
    viewSki.appendChild(box);
  }
}

/* ===== 资源数据加载 =====
   以 resources.json 为准；加载成功则原地替换内嵌数据并重绘。
   file:// 打开（fetch 不可用）或网络异常时静默降级，继续用内嵌数据，
   因此页面在任何情况下都有内容可显示。
   注意：指南与技能表目前只用内嵌数据（它们不常变，内嵌可保证离线可用）。 */
function applyResources(list) {
  if (!Array.isArray(list) || !list.length) return false;
  RESOURCES.length = 0;
  for (const r of list) RESOURCES.push(Object.assign({}, r));
  rebuildTitleIndex();
  updateStats();
  renderSubchips();
  render();
  if (activeMode === "guides") renderGuides();
  if (activeMode === "skills") viewSkills();
  return true;
}

function loadResources() {
  if (typeof fetch !== "function" || location.protocol === "file:") return;
  fetch("resources.json", { cache: "no-cache" })
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function (doc) { applyResources(doc && doc.resources); })
    .catch(function () { /* 静默降级到内嵌数据 */ });
}

rebuildTitleIndex();
renderModebar();
applyMode();
loadResources();
</script>
