<title>权益广场 · 校团委青年权益服务中心</title>
<style>
:root {
    /* 科大蓝 + 白。
       --primary 取自学校官网 CSS 主色 #004ca1，与校徽主色 #034ea1 基本一致。
       背景用极浅的冷灰蓝，让大面积白色卡片有层次，又不抢蓝色的视觉重心。 */
    --ustc-blue: #004ca1;
    --ustc-blue-deep: #00376f;
    --ustc-blue-light: #e8f0fa;
    --bg: #f4f7fb;
    --card: #ffffff;
    --ink: #1e293b;
    --muted: #6b7a8d;
    --primary: #004ca1;
    --primary-deep: #00376f;
    --accent: #c9a227;
    --border: #dbe3ee;
    --c-kecheng: #2e7d5b;
    --c-shipin: #b4552d;
    --c-biancheng: #35579b;
    --c-xueshu: #6d4c9f;
    --c-xiaonei: #0e7490;
    --c-xiaolv: #a16207;
    --c-jingsai: #b91c1c;
    --c-xiaoyuan: #be185d;
    --c-yingyu: #4d7c0f;
    --c-ai: #1d4ed8;
  }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
/* ===== Hero ===== */

  /* ===== Sticky toolbar ===== */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(247, 244, 236, 0.88); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 6px 24px rgba(34, 48, 43, 0.05);
    padding: 14px 0;
  }
.toolbar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search {
    position: relative; flex: 1 1 240px; max-width: 340px;
  }
.search svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; stroke: var(--muted);
  }
.search input {
    width: 100%; padding: 10px 16px 10px 38px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--card); color: var(--ink); outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
.search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23, 94, 76, 0.12); }
.chip {
    padding: 8px 18px; border-radius: 999px; font-size: 14px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--ink); cursor: pointer; transition: all .18s;
  }
.chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
.chip.active {
    background: var(--primary); border-color: var(--primary); color: #fff;
    box-shadow: 0 4px 14px rgba(23, 94, 76, 0.3);
  }
.free-toggle {
    margin-left: auto; font-size: 14px; color: var(--muted);
    display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
  }
.free-toggle input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
/* ===== Cards ===== */
  main { padding: 36px 0 56px; }
.grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
.card {
    position: relative; display: block; overflow: hidden;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px 22px 18px;
    text-decoration: none; color: inherit;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    animation: rise .5s ease both;
  }
.card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, var(--cat-color, var(--primary)), transparent 80%);
    opacity: 0; transition: opacity .22s;
  }
.card:hover {
    transform: translateY(-4px);
    border-color: rgba(23, 94, 76, 0.35);
    box-shadow: 0 16px 40px rgba(34, 48, 43, 0.12);
  }
.card:hover::after { opacity: 1; }
@keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
.card-head { display: flex; align-items: center; gap: 13px; }
.card-icon {
    width: 46px; height: 46px; flex: none; border-radius: 13px;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: color-mix(in srgb, var(--cat-color, var(--primary)) 12%, #fff);
    border: 1px solid color-mix(in srgb, var(--cat-color, var(--primary)) 22%, #fff);
  }
.card-name { font-size: 16.5px; font-weight: 700; letter-spacing: .3px; }
.card-jump {
    margin-left: auto; flex: none; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; border: 1px solid var(--border);
    transition: all .2s;
  }
.card:hover .card-jump {
    background: var(--primary); border-color: var(--primary); color: #fff;
    transform: rotate(45deg);
  }
.card-desc { margin-top: 12px; font-size: 13.5px; color: var(--muted); min-height: 44px; }
.card-foot { margin-top: 14px; display: flex; gap: 8px; }
.badge { font-size: 12px; padding: 3px 11px; border-radius: 999px; letter-spacing: .3px; }
.badge.cat {
    color: var(--cat-color, var(--primary));
    background: color-mix(in srgb, var(--cat-color, var(--primary)) 10%, #fff);
  }
.badge.free { background: #e8f0fa; color: #0a63bd; }
.badge.paid { background: #f8ecd8; color: #96660f; }
.empty { text-align: center; color: var(--muted); padding: 72px 0; font-size: 15px; }
/* 搜索结果计数条：告诉用户"筛完剩几条"以及"为什么这些条目命中" */
  .result-bar {
    margin: 0 0 14px; font-size: 13.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
.result-bar b { color: var(--primary); font-size: 15px; }
.result-bar .rb-kw {
    background: #fdf3d7; color: #8a6100; padding: 1px 7px; border-radius: 5px;
    font-weight: 600;
  }
.result-bar .rb-clear {
    margin-left: auto; font-size: 12.5px; color: var(--muted);
    background: none; border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 11px; cursor: pointer;
  }
.result-bar .rb-clear:hover { border-color: var(--primary); color: var(--primary); }
/* 命中关键词高亮 */
  mark.hl { background: #fdf3d7; color: #8a6100; padding: 0 2px; border-radius: 3px; font-weight: 600; }
/* 匹配位置提示 */
  .card-why { font-size: 11.5px; color: #a08a5a; margin-top: 6px; }
/* 无结果时的标签建议 */
  .empty .eh-tip { display: block; margin-top: 10px; font-size: 13px; }
.empty .eh-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.empty .eh-tag {
    font-size: 13px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; color: var(--primary);
  }
.empty .eh-tag:hover { border-color: var(--primary); background: #f2f7fd; }
/* ---------- 历年试卷（列表视图） ---------- */
  /* 1580 条用卡片太重，这里用紧凑列表：一行一条，便于按年份快速扫读 */

/* ---------- 权益反馈 ---------- */
  /* 用途：把校内各反馈渠道汇总成一张清单，学生遇到问题知道找谁。
     与资源卡片不同，这里强调「按场景分组」——出问题的人先想的是
     "我这是哪类问题"，而不是"哪个部门管"。 */
  .rt-intro {
    padding: 18px 20px; background: #f2f7fd; border: 1px solid #d5e3f4;
    border-radius: 14px; margin: 4px 0 22px; font-size: 14px; line-height: 1.7; color: #334155;
  }
.rt-intro b { color: var(--primary); }
.rt-cat { margin-bottom: 26px; }
.rt-cat h3 {
    font-size: 16px; font-weight: 700; color: var(--primary);
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;
  }
.rt-cat h3 .rt-cat-desc { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.rt-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 10px; }
.rt-item {
    border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px;
    background: #fff; display: flex; flex-direction: column; gap: 6px;
  }
.rt-item.todo { background: #f8fafd; border-style: dashed; }
.rt-item .rt-name { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.rt-item .rt-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; flex: 1; }
.rt-item .rt-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.rt-item .rt-go {
    font-size: 13px; padding: 5px 14px; border-radius: 999px; text-decoration: none;
    border: 1px solid var(--border); color: var(--primary); background: #fff; white-space: nowrap;
  }
.rt-item .rt-go:hover { border-color: var(--primary); background: #f2f7fd; }
.rt-item .rt-wait { font-size: 12px; color: #a8b2c1; }
.rt-item .rt-val {
    font-size: 12px; color: #64748b; background: #f4f6f4; border-radius: 6px;
    padding: 2px 7px; font-family: ui-monospace, Consolas, monospace;
    max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
.rt-item .rt-flex { flex: 1; }
.rt-item .rt-wx { font-size: 12px; color: var(--primary-deep); }
.rt-item .rt-ok { font-size: 11px; color: #0a63bd; }
.rt-item .rt-ok::before { content: "●"; font-size: 8px; margin-right: 4px; vertical-align: middle; }

/* ---------- 首页：权益宣传工作 + 两个入口 ---------- */
  .home-wrap { padding-top: 8px; }

  .promo {
    border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
    background: #fff; margin-bottom: 26px;
  }
.promo-head {
    padding: 22px 26px;
    background: linear-gradient(135deg, #004ca1 0%, #0a63bd 60%, #146cc7 100%);
    color: #fff;
  }
.promo-head h2 { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
.promo-head p { font-size: 13px; color: #cfe0f5; margin-top: 5px; }
.promo-src {
    display: inline-block; margin-left: 10px; vertical-align: middle;

    background: rgba(255,255,255,.18); color: #fff;
  }
.promo-body { padding: 8px 26px 22px; }
.promo-row {
    display: flex; gap: 14px; align-items: flex-start;

  }

.promo-ico {
    flex: none; width: 38px; height: 38px; border-radius: 11px;

  }
.promo-row .promo-txt { flex: 1; min-width: 0; }
.promo-row h4 { font-size: 14.5px; font-weight: 700; color: var(--ink); }

  }
/* 工作动态列表（首页宣传区里的真实条目） */
  .news-block { padding: 2px 0 6px; }
.news-block > h4 {
    font-size: 14.5px; font-weight: 700; color: var(--ink);

  }

    display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px dashed #e6ecf5;
    text-decoration: none; color: inherit;
  }
.news-item:last-of-type { border-bottom: 0; }
.news-item:hover .news-title { color: var(--primary); }
.news-item .news-date {
    flex: 0 0 82px; font-size: 12.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; padding-top: 2px;
  }

  }

  }

  }
.news-item .news-tag {

  }
@media (max-width: 640px) {

}
/* ---------- 首页图标宫格（参考 App 首页的九宫格入口） ---------- */
  /* 分成两组：权益服务在上、学习资源在下。
     这样一眼能看出网站重心在权益服务，而不是把 8 个入口混在一起。 */
  .icon-grid {
    display: block;
    background: #fff; border: 1px solid var(--border); border-radius: 18px;
    padding: 6px 8px 10px; margin-bottom: 18px;
  }
.ig-group { padding: 4px 0 2px; }
.ig-group + .ig-group {
    margin-top: 4px; padding-top: 10px; border-top: 1px dashed #e0e8f3;
  }
.ig-group-head {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 10px 2px; font-size: 12.5px; font-weight: 700; color: var(--ink);
  }
.ig-group-dot {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
  }
.ig-group-rights .ig-group-dot { background: var(--ustc-blue); }
.ig-group-cnt {
    margin-left: auto; font-size: 11px; font-weight: 400; color: var(--muted);
  }
.ig-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.ig-item {
    display: flex; flex-direction: column; align-items: center; gap: 7px;

  }
.ig-item:hover { background: #f6f9f7; transform: translateY(-2px); }
.ig-icon {
    width: 46px; height: 46px; border-radius: 14px; flex: none;

.ig-rights .ig-icon { background: #e8f0fa; }
.ig-study .ig-icon { background: #e8f0fa; }
.ig-more .ig-icon { background: #f2f0ea; }
.ig-label {
    font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.25;

    word-break: break-all;
  }
@media (max-width: 720px) {

}

  }

/* ⚠️ 必须换行：一级按钮在窄屏（<420px）下总宽超过视口，

  .modebar .wrap {
    display: flex; flex-wrap: wrap; gap: 8px;

  /* ===== 资源详情弹层 =====

     两者分开，既保留"一键直达"，又满足规范"打开资源卡片即可知道这是什么"。 */
  .card-jump { cursor: pointer; position: relative; z-index: 2; }

// 顶部统计数字统一由这里更新：分类数从 CATEGORIES 现算，
// 避免"新增分类后 Hero 区还写着旧数字"（原先硬编码为 9）。
/* 首页统计数字。
   注意：这些元素可能不存在（例如测试桩只提供部分元素，或以后调整首页），
   所以统一走 setStat() 做空值保护 —— 直接 getElementById().textContent 会抛错。 */
function setStat(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}
function updateStats() {
  setStat("total", RESOURCES.length);
  setStat("catCount", CATEGORIES.length - 1);   // 减去"全部"
  setStat("freeCount", RESOURCES.filter((r) => r.free).length);
}

updateStats();

// ===== 二级筛选：选中大类后，在其下方显示该大类的子分类 =====
// 设计：大类仍是第一层，子分类只在大类被选中时出现，避免首页一次显示 52 个标签。
const subchips = document.getElementById("subchips");
let activeSub = "";

function renderSubchips() {
  subchips.innerHTML = "";
  if (activeCategory === "全部") { subchips.hidden = true; return; }

  const inCat = RESOURCES.filter((r) => r.category === activeCategory);
  const subs = [];
  for (const r of inCat) if (r.subcategory && !subs.includes(r.subcategory)) subs.push(r.subcategory);

  if (subs.length <= 1) { subchips.hidden = true; return; }  // 只有一个子分类就不必显示
  subchips.hidden = false;

  const label = document.createElement("span");
  label.className = "sub-label";
  label.textContent = "子分类：";
  subchips.appendChild(label);

  const mk = (name, count) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sub-chip" + (activeSub === name ? " active" : "");
    b.textContent = name;
    if (count !== undefined) {
      const s = document.createElement("span");
      s.className = "sub-count";
      s.textContent = "(" + count + ")";
      b.appendChild(s);
    }
    b.addEventListener("click", () => {
      activeSub = (name === "全部" ? "" : name);
      renderSubchips();
      render();
    });
    return b;
  };

  subchips.appendChild(mk("全部", inCat.length));
  for (const s of subs) subchips.appendChild(mk(s, inCat.filter((r) => r.subcategory === s).length));
}

/* 分类标签按当前分区的可见分类重建。
   权益服务区只显示「校内平台 / 校园信息」，学习资源区显示其余 8 类。
   重建而不是一次性建好：同一个 #chips 容器被多个视图复用，切分区时要换掉标签。 */
function renderChips() {
  const cats = currentCats();
  // 清掉旧的分类标签（保留搜索框与"只看免费"）
  for (const c of Array.from(chips.querySelectorAll(".chip"))) c.remove();

  const ft = chips.querySelector(".free-toggle");
  const allBtn = document.createElement("button");
  allBtn.type = "button";
  allBtn.className = "chip" + (activeCategory === "全部" ? " active" : "");
  allBtn.textContent = "全部";
  allBtn.addEventListener("click", () => {
    activeCategory = "全部";
    activeSub = "";
    for (const c of chips.querySelectorAll(".chip")) c.classList.toggle("active", c.textContent === "全部");
    renderSubchips();
    render();
  });
  chips.insertBefore(allBtn, ft);

  for (const cat of cats) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip" + (cat === activeCategory ? " active" : "");
    btn.textContent = cat;
    btn.addEventListener("click", () => {
      activeCategory = cat;
      activeSub = "";
      for (const c of chips.querySelectorAll(".chip")) c.classList.toggle("active", c.textContent === cat);
      renderSubchips();
      render();
    });
    chips.insertBefore(btn, ft);
  }
}

/* ===== 搜索匹配 =====
   为什么要拆词：以前是 searchText(r).includes("数学 期末") —— 把整个输入当成一个
   连续字符串去匹配，而资源里不可能出现"数学 期末"这一串，所以多关键词永远搜不到东西。
   现在改成：按空格拆成多个词，每个词都要命中（AND）。搜「数学 期末」= 同时含这两个词。 */

// 归一化：去掉空格与常见连接符，让 "pytorch" 能匹配 "PyTorch 版"、"b1" 能匹配 "B1"。
// ⚠️ 必须保留 + 和 # —— 它们是 C++ / C# 这类名称的语义字符。
//    踩过的坑：把 + 当标点扔掉后，搜 "c++" 会被拆成 "c"，于是命中所有含字母 C 的条目。
function normLoose(s) {
  return String(s == null ? "" : s).toLowerCase()
    .replace(/[\s\u3000]+/g, "")
    .replace(/[-_—－·・.。]/g, "");
}

function normText(s) {
  return String(s == null ? "" : s).toLowerCase();
}

/* 抽出"参与匹配的字符"及其在原文中的下标。
   只保留汉字 / 拉丁字母 / 数字 / + / # —— 标点与空格不参与匹配。
   + 与 # 必须保留：C++、C# 是真实的编程语言名，扔掉它们会让 "c++" 退化成 "c"。
   这一步是模糊匹配与高亮的共同基础，两者必须用同一套口径，否则会出现
   "搜到了却不高亮"或"高亮了却搜不到"的矛盾。 */
function baseChars(src) {
  const chars = [];
  const idx = [];
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (/[\u4e00-\u9fa5]/.test(ch) || /[0-9A-Za-z+#]/.test(ch)) {
      chars.push(ch.toLowerCase());
      idx.push(i);
    }
  }
  return { chars, idx };
}

/* 最长公共子串长度。用于汉字的错别字容错。
   为什么不用"按位置逐个比较"：「菜鸟教成」对上「菜鸟教程」时，
   位置 3、4 都不相等（教≠程、成≠程），逐位比较会得出相似度 0.5 而漏掉；
   但两者真正共享的是「菜鸟教」(3/4)，最长公共子串才反映真实相似度。 */
function lcsLen(a, b) {
  if (!a.length || !b.length) return 0;
  let prev = new Array(b.length + 1).fill(0);
  let best = 0;
  for (let i = 1; i <= a.length; i++) {
    const cur = new Array(b.length + 1).fill(0);
    for (let j = 1; j <= b.length; j++) {
      if (a[i - 1] === b[j - 1]) {
        cur[j] = prev[j - 1] + 1;
        if (cur[j] > best) best = cur[j];
      }
    }
    prev = cur;
  }
  return best;
}

/* 模糊容错。汉字与拉丁用不同策略 —— 这是踩过坑的地方：
     汉字：最长公共子串 / 词长 >= 0.75 即命中（「菜鸟教成」→「菜鸟教程」）。
     拉丁：子序列 + 跨度紧凑。绝不能只看"字符是否出现过" ——
           字母在英文文案里到处都是，会让 leetcode 命中几十条无关资源。
           子序列要求字母按顺序出现，且首尾跨度不能远大于词长。 */
function fuzzyHit(text, term) {
  const t = normLoose(term);
  if (!t) return false;
  const isCJK = /[\u4e00-\u9fa5]/.test(t);
  const { chars: s } = baseChars(text);
  if (!s.length) return false;

  if (isCJK) {
    const tc = t.split("").filter((c) => /[\u4e00-\u9fa5]/.test(c));
    if (tc.length < 3) return false;
    // 与文本的若干候选窗口比较：直接用整段文本做 LCS 即可（LCS 本身按子串算）
    const ratio = lcsLen(tc, s) / tc.length;
    return ratio >= 0.75;
  }

  // 拉丁：子序列 + 跨度约束
  if (t.length < 4) return false;
  const tc = t.split("").filter((c) => /[0-9a-z]/.test(c));
  if (tc.length < 4) return false;
  let ti = 0;
  let first = -1;
  let last = -1;
  for (let i = 0; i < s.length && ti < tc.length; i++) {
    if (s[i] === tc[ti]) {
      if (first === -1) first = i;
      last = i;
      ti++;
    }
  }
  if (ti < tc.length) return false;
  return (last - first + 1) <= tc.length * 3;
}

function looseHit(text, term) {
  if (!term) return false;
  if (normText(text).includes(normText(term))) return true;
  if (normLoose(text).includes(normLoose(term))) return true;
  return fuzzyHit(text, term);
}

/* 把查询拆成词。中英混排时：英文/数字按空格与标点拆，中文连续串保留整段
   （再按 2 字滑窗补一些子词，便于"期末"这种短词命中）。 */
function splitQuery(q) {
  const raw = String(q == null ? "" : q).trim();
  if (!raw) return [];
  const terms = [];
  for (const part of raw.split(/[\s\u3000,，、;；]+/)) {
    const p = part.trim();
    if (!p) continue;
    terms.push(p);
    // 中文长串再拆出 2 字滑窗（"数学分析" → 数学/学分/分析），提高召回
    const cn = p.replace(/[^\u4e00-\u9fa5]/g, "");
    if (cn.length >= 3) {
      for (let i = 0; i + 2 <= cn.length; i++) {
        const g = cn.slice(i, i + 2);
        if (!terms.includes(g)) terms.push(g);
      }
    }
  }
  return terms;
}

/* 一条资源对某个词的匹配得分；返回 0 表示不命中。 */
function termScore(r, term) {
  if (!term) return 0;
  let s = 0;
  if (looseHit(r.name, term)) s += 100;
  if ((r.tags || []).some((t) => looseHit(t, term))) s += 50;
  if (looseHit(r.subcategory, term)) s += 30;
  if (looseHit(r.category, term)) s += 20;
  if (looseHit(r.source, term)) s += 15;
  if (looseHit(r.description, term)) s += 10;
  return s;
}
/* 相关度打分：所有词都命中才算匹配，分数为各词得分之和。
   注意：打分只影响【顺序】，不影响【是否出现】—— 命中即列出。 */
function scoreOf(r, terms) {
  const list = Array.isArray(terms) ? terms : splitQuery(terms);
  if (!list.length) return 0;
  let total = 0;
  for (const t of list) {
    const s = termScore(r, t);
    if (s === 0) return 0;          // 有一个词没命中 → 整条不算匹配
    total += s;
  }
  // 标题命中的条目，名字越短通常越"就是它"
  if (looseHit(r.name, list[0])) total += Math.max(0, 20 - r.name.length) / 20;
  return total;
}

/* 搜不到时给建议 —— 从资源库的标签里找与查询最接近的。
   为什么值得做：空结果只说"换个关键词"，等于把问题丢回给用户；
   而这些标签是站内真实存在的词，点一下就能搜到东西。 */
function suggestTags(keyword, limit) {
  if (!keyword) return [];
  const kw = keyword.toLowerCase();
  // 查询词拆解：英文按空格/标点拆，中文取 2 字滑窗 —— 便于与标签做字符级比对
  const frags = new Set();
  for (const t of kw.split(/[\s,，、。.·()（）\-_/]+/)) if (t.length >= 2) frags.add(t);
  const cn = kw.replace(/[^\u4e00-\u9fa5]/g, "");
  for (let i = 0; i + 2 <= cn.length; i++) frags.add(cn.slice(i, i + 2));
  if (!frags.size) frags.add(kw);

  const counts = new Map();
  for (const r of RESOURCES) for (const t of (r.tags || [])) counts.set(t, (counts.get(t) || 0) + 1);

  const scored = [];
  for (const [tag, count] of counts) {
    const lower = tag.toLowerCase();
    let s = 0;
    if (lower === kw) s = 1000;
    else if (lower.includes(kw) || kw.includes(lower)) s = 500;
    else for (const f of frags) if (lower.includes(f)) s += 60;
    if (s > 0) scored.push({ tag, score: s + Math.min(count, 30) });
  }
  scored.sort((a, b) => b.score - a.score || a.tag.localeCompare(b.tag));
  return scored.slice(0, limit || 6).map((x) => x.tag);
}

function searchText(r) {
  // 检索范围：名称 + 简介 + 标签 + 分类 + 来源站点。
  // 标签参与检索是"标签搜索"的基础；分类与来源一起纳入，方便直接搜"论文""镜像站""校内平台"。
  return [
    r.name,
    r.description,
    (r.tags || []).join(" "),
    r.category,
    r.source || "",
  ].join(" ").toLowerCase();
}

/* 判断某条资源在哪些字段命中了关键词 —— 用于卡片上的"匹配位置"提示。
   为什么需要它：用户搜一个词，结果里出现看起来不相干的条目时会困惑，
   标明"因为标签里有这个词"就能让他立刻判断要不要点。 */
/* 命中了哪些字段 —— 用于卡片上的「匹配：…」提示。
   用松散匹配（跳过空格/连字符），与搜索口径一致，否则会出现
   "明明搜到了，却不显示命中原因"的矛盾。 */
function matchReasons(r, terms) {
  const list = Array.isArray(terms) ? terms : splitQuery(terms);
  if (!list.length) return [];
  const any = (s) => list.some((t) => looseHit(s, t));
  const out = [];
  if (any(r.name)) out.push("名称");
  const hitTags = (r.tags || []).filter((t) => list.some((x) => looseHit(t, x)));
  if (hitTags.length) out.push("标签「" + hitTags.slice(0, 2).join("、") + "」");
  if (any(r.description)) out.push("简介");
  if (any(r.category)) out.push("分类");
  if (any(r.subcategory)) out.push("子分类");
  if (any(r.source)) out.push("来源");
  return out;
}

/* 找出文本里所有命中片段的位置，用于高亮。
   关键点：搜索用的是「松散匹配」（忽略空格与连字符），所以高亮也必须按同样口径，
   否则搜 pytorch 时 "PyTorch 版" 明明命中了却看不到高亮 —— 用户会以为搜错了。
   segs = 归一化后的字符在原文中的下标数组（被忽略的字符不进入该数组）。 */
function hitRanges(src, terms) {
  const { chars, idx } = baseChars(src);
  if (!chars.length) return [];
  const norm = chars.join("");
  const ranges = [];
  for (const t of terms) {
    // 高亮用的词同样要保留 + 和 #，与 baseChars 口径一致
    const nt = baseChars(String(t)).chars.join("");
    if (!nt) continue;
    let from = 0;
    for (;;) {
      const at = norm.indexOf(nt, from);
      if (at === -1) break;
      ranges.push([idx[at], idx[at + nt.length - 1] + 1]);
      from = at + nt.length;
    }
  }
  // 合并重叠区间，避免嵌套 <mark>
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const rg of ranges) {
    const last = merged[merged.length - 1];
    if (last && rg[0] <= last[1]) last[1] = Math.max(last[1], rg[1]);
    else merged.push([rg[0], rg[1]]);
  }
  return merged;
}

/* 把文本里出现的命中片段包进 <mark>。必须走 DOM API 而不是拼 HTML 字符串，
   否则资源标题里的 < > & 等字符会被当成标签解析（名称里确实有 "C++" 这类内容）。 */
function highlightInto(el, text, terms) {
  el.textContent = "";
  const src = String(text == null ? "" : text);
  const list = Array.isArray(terms) ? terms : splitQuery(terms);
  if (!list.length) { el.textContent = src; return; }
  const ranges = hitRanges(src, list);
  if (!ranges.length) { el.textContent = src; return; }
  let from = 0;
  for (const [a, b] of ranges) {
    if (a > from) el.appendChild(document.createTextNode(src.slice(from, a)));
    const m = document.createElement("mark");
    m.className = "hl";
    m.textContent = src.slice(a, b);
    el.appendChild(m);
    from = b;
  }
  if (from < src.length) el.appendChild(document.createTextNode(src.slice(from)));
}

/* 结果计数条：说清"筛完剩几条、按什么关键词筛的"，并给一个清空按钮。
   只在用户主动筛选时出现 —— 默认浏览全部时不打扰。 */
const resultBar = document.getElementById("resultBar");
let rbClearText = null;   // 桌面端显示"清除筛选"，窄屏显示"清除"

function renderResultBar(terms, count) {
  if (!resultBar) return;
  const hasTerms = Array.isArray(terms) ? terms.length > 0 : !!terms;
  const filtering = !!(hasTerms || activeCategory !== "全部" || activeSub || freeOnly.checked);
  if (!filtering) { resultBar.hidden = true; resultBar.textContent = ""; return; }

  resultBar.hidden = false;
  resultBar.textContent = "";

  const label = document.createElement("span");
  label.appendChild(document.createTextNode("找到 "));
  const b = document.createElement("b");
  b.textContent = String(count);
  label.appendChild(b);
  label.appendChild(document.createTextNode(" 条"));

  // 说清筛选条件
  const parts = [];
  if (activeCategory !== "全部") parts.push(activeCategory);
  if (activeSub) parts.push(activeSub);
  if (freeOnly.checked) parts.push("只看免费");
  if (parts.length) label.appendChild(document.createTextNode("　·　" + parts.join(" / ")));

  if (hasTerms) {
    label.appendChild(document.createTextNode("　·　关键词 "));
    const kw = document.createElement("span");
    kw.className = "rb-kw";
    kw.textContent = q.value.trim();
    label.appendChild(kw);
    // 多关键词时说明「每个词都要命中」，否则用户不知道结果是怎么筛出来的
    if (terms.length > 1) {
      label.appendChild(document.createTextNode("　·　已拆为 " + terms.length + " 个词，需全部命中"));
    }
  }
  resultBar.appendChild(label);

  const clear = document.createElement("button");
  clear.type = "button";
  clear.className = "rb-clear";
  clear.textContent = rbClearText || "清除筛选";
  clear.addEventListener("click", () => {
    q.value = "";
    freeOnly.checked = false;
    activeCategory = "全部";
    activeSub = null;
    for (const c of chips.querySelectorAll(".chip")) c.classList.toggle("active", c.textContent === "全部");
    renderSubchips();
    render();
  });
  resultBar.appendChild(clear);
}

function render() {
  const keyword = q.value.trim();
  const terms = splitQuery(keyword);
  const scope = currentCats();
  const list = RESOURCES.filter((r) => {
    // 分区过滤：每个视图只显示自己那几类资源
    if (scope.indexOf(r.category) < 0) return false;
    if (activeCategory !== "全部" && r.category !== activeCategory) return false;
    if (activeSub && r.subcategory !== activeSub) return false;
    if (freeOnly.checked && !r.free) return false;
    // 多关键词：每个词都要命中（AND）。scoreOf 返回 0 即表示有词没命中。
    if (terms.length && scoreOf(r, terms) === 0) return false;
    return true;
  });
  // 有搜索词时按相关度排序：标题命中 > 标签命中 > 子分类 > 分类 > 来源 > 简介。
  // 无搜索词时保持资源库原始顺序（策划过的顺序比"相关度"更有意义）。
  if (terms.length) {
    const scored = list.map((r, idx) => ({ r, idx, s: scoreOf(r, terms) }));
    scored.sort((a, b) => b.s - a.s || a.idx - b.idx);
    list.length = 0;
    for (const x of scored) list.push(x.r);
  }
  grid.innerHTML = "";
  renderResultBar(terms, list.length);
  renderEmptyHint(keyword, list.length);
  list.forEach((r, i) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute("data-title", r.name);
    a.style.setProperty("--cat-color", CAT_COLORS[r.category] || "var(--primary)");
    a.style.animationDelay = Math.min(i * 35, 400) + "ms";
    a.innerHTML =
      '<div class="card-head"><span class="card-icon">' + r.icon + '</span>' +
      '<span class="card-name"></span><span class="card-jump" title="直接打开网站">↗</span></div>' +
      '<p class="card-desc"></p>' +
      (keyword ? '<div class="card-why"></div>' : '') +
      '<div class="card-foot"><span class="badge cat">' + r.category + "</span>" +
      (r.free ? '<span class="badge free">免费</span>' : '<span class="badge paid">付费/部分免费</span>') +
      "</div>";
    // 高亮命中关键词，并标注命中位置（名称/标签/简介…）
    highlightInto(a.querySelector(".card-name"), r.name, terms);
    highlightInto(a.querySelector(".card-desc"), r.description, terms);
    if (terms.length) {
      const why = a.querySelector(".card-why");
      const reasons = matchReasons(r, terms);
      if (why) why.textContent = reasons.length ? "匹配：" + reasons.join(" · ") : "";
    }
    // 卡片主体 -> 打开详情；右上箭头 -> 直接跳转（阻止冒泡以免同时弹层）
    const jump = a.querySelector(".card-jump");
    if (jump) jump.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      window.open(r.url, "_blank", "noopener,noreferrer");
    });
    a.addEventListener("click", (ev) => {
      ev.preventDefault();          // 卡片主体不再直接跳转，改为看详情
      openDetail(r.name);
    });
    grid.appendChild(a);
  });
  empty.hidden = list.length > 0;
}

/* 无结果时不只是说"没找到"，而是给出站内真实存在的相近标签。
   点一下就能搜到东西 —— 比让用户自己想词有用得多。 */
function renderEmptyHint(keyword, count) {
  if (!empty) return;
  if (count > 0 || !keyword) {
    empty.textContent = "没有找到匹配的资源,换个关键词试试。";
    return;
  }
  empty.textContent = "";
  const p = document.createElement("span");
  p.textContent = "没有找到「" + q.value.trim() + "」相关的资源。";
  empty.appendChild(p);
  const tags = suggestTags(keyword, 6);
  if (!tags.length) return;
  const p2 = document.createElement("span");
  p2.className = "eh-tip";
  p2.textContent = "试试这些标签：";
  empty.appendChild(p2);
  const box = document.createElement("span");
  box.className = "eh-tags";
  for (const t of tags) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "eh-tag";
    b.textContent = t;
    b.addEventListener("click", () => {
      q.value = t;
      activeCategory = "全部";
      activeSub = "";
      for (const c of chips.querySelectorAll(".chip")) c.classList.toggle("active", c.textContent === "全部");
      renderSubchips();
      render();
    });
    box.appendChild(b);
  }
  empty.appendChild(box);
}

/* ===================================================================
   资源详情弹层
   目的：规范要求"用户打开资源卡片即可知道：这是什么、适合谁、是否免费、
   是否需要注册、是否需要学生身份、是否需要特殊配置"。此前卡片只显示
   名称/简介/分类/免费四项，其余字段无从查看。
   =================================================================== */
const detailMask = document.getElementById("detail-mask");
const detailBox = document.getElementById("detail-box");
let lastFocus = null;

// 把资源记录里的字段拆成"能直接展示"和"未核验"两类
const FIELD_KEYS = [
  ["account_requirement", "注册要求"],
  ["student_requirement", "学生身份"],
  ["network_requirement", "网络要求"],
  ["hardware_requirement", "硬件要求"],
  ["language_support", "语言支持"],
  ["cost", "费用"],
  ["source", "来源站点"],
  ["subcategory", "子分类"],
  ["last_verified", "最近核验"],
  ["verification_status", "核验状态"],
  ["alternative_resources", "国内替代"],
];

function isUnknown(v) {
  if (v === undefined || v === null) return true;
  const s = String(v).trim();
  return s === "" || s === "未核验" || s === "待复核";
}

function openDetail(title) {
  const r = byTitle.get(title);
  if (!r) return;
  lastFocus = document.activeElement;
  detailBox.innerHTML = "";
  detailBox.style.setProperty("--dt-color", CAT_COLORS[r.category] || "var(--primary)");

  // 头部
  const head = document.createElement("div");
  head.className = "dt-head";
  head.innerHTML =
    '<span class="dt-icon"></span>' +
    '<div style="min-width:0"><div class="dt-title"></div><div class="dt-sub"></div></div>' +
    '<button type="button" class="dt-close" aria-label="关闭">✕</button>';
  head.querySelector(".dt-icon").textContent = r.icon || "•";
  head.querySelector(".dt-title").textContent = r.name;
  head.querySelector(".dt-sub").textContent = r.category + (r.subcategory ? " · " + r.subcategory : "");
  head.querySelector(".dt-close").addEventListener("click", closeDetail);
  detailBox.appendChild(head);

  // 简介
  const desc = document.createElement("p");
  desc.className = "dt-desc";
  desc.textContent = r.description || "";
  detailBox.appendChild(desc);

  // 标签
  if (Array.isArray(r.tags) && r.tags.length) {
    const tw = document.createElement("div");
    tw.className = "dt-tags";
    for (const t of r.tags) {
      const s = document.createElement("span");
      s.textContent = t;
      tw.appendChild(s);
    }
    detailBox.appendChild(tw);
  }

  // 操作
  const acts = document.createElement("div");
  acts.className = "dt-actions";
  const go = document.createElement("a");
  go.className = "dt-go";
  go.href = r.url;
  go.target = "_blank";
  go.rel = "noopener noreferrer";
  go.textContent = "前往网站 ↗";
  acts.appendChild(go);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    const cp = document.createElement("button");
    cp.type = "button";
    cp.className = "dt-copy";
    cp.textContent = "复制链接";
    cp.addEventListener("click", () => {
      navigator.clipboard.writeText(r.url).then(() => {
        cp.textContent = "已复制 ✓";

      }).catch(() => { cp.textContent = "复制失败"; });
    });
    acts.appendChild(cp);
  }

  // 报告问题：把资源信息复制到剪贴板，再打开反馈问卷。
  // 为什么用"复制 + 打开"而不是直接拼 URL 参数：
  // 腾讯问卷的链接参数预填是【商业版付费功能】，免费版用不了（官方文档已注明）。
  // 所以退而求其次 —— 替用户把要填的内容准备好，他粘贴一次即可。
  const rp = document.createElement("button");
  rp.type = "button";
  rp.className = "dt-report";
  rp.textContent = "报告问题";

  detailBox.appendChild(acts);

  const hint = document.createElement("p");
  hint.className = "dt-hint";
  hint.textContent = "发现链接打不开、简介或分类有误、使用条件与实际不符？点「报告问题」即可反馈。";
  detailBox.appendChild(hint);

  rp.addEventListener("click", () => {
    const payload = r.name + "\n" + r.url + "\n" + r.category + (r.subcategory ? " · " + r.subcategory : "");
    const openForm = () => {
      window.open(FEEDBACK_FORM_URL, "_blank", "noopener,noreferrer");
      hint.classList.add("ok");
      hint.textContent = "已复制本条资源信息，粘贴到问卷即可（Ctrl+V）。感谢反馈！";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload).then(openForm).catch(() => {
        window.open(FEEDBACK_FORM_URL, "_blank", "noopener,noreferrer");
        hint.textContent = "已打开问卷。请手动填写资源名称：「" + r.name + "」。";
      });
    } else {
      window.open(FEEDBACK_FORM_URL, "_blank", "noopener,noreferrer");
      hint.textContent = "已打开问卷。请手动填写资源名称：「" + r.name + "」。";
    }
  });

  const url = document.createElement("div");
  url.className = "dt-url";
  url.textContent = r.url;
  detailBox.appendChild(url);

  // 字段明细
  const sec = document.createElement("div");
  sec.className = "dt-section";
  const h5 = document.createElement("h5");
  h5.textContent = "使用条件";
  sec.appendChild(h5);
  const g = document.createElement("div");

  let unknownCount = 0;
  for (const [key, label] of FIELD_KEYS) {
    const row = document.createElement("div");
    row.className = "dt-row";
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = label;
    const v = document.createElement("span");
    v.className = "v";
    const val = r[key];
    if (isUnknown(val)) {
      v.classList.add("no");

      v.classList.add("yes");
      v.textContent = String(val);
    } else {
      v.textContent = String(val);
    }
    row.appendChild(k);
    row.appendChild(v);
    g.appendChild(row);
  }
  sec.appendChild(g);
  detailBox.appendChild(sec);

  // 未核验提示：如实说明，不假装数据完整
  if (unknownCount > 0) {
    const note = document.createElement("p");
    note.className = "dt-note";
    note.textContent = "上表中 " + unknownCount + " 个字段尚未经人工核验（注册要求、网络要求、学生身份等）。" +
      "我们不对未核实的使用条件做猜测——如果你实测过，欢迎反馈更正。";
    detailBox.appendChild(note);
  }

  detailMask.hidden = false;
  document.body.classList.add("modal-open");
  const closeBtn = detailBox.querySelector(".dt-close");

/* 统计某几组里"可用"的渠道数。原来 key / repair 各写了一份，收敛成这一个。 */
function countChannelsIn(catIds) {
  if (!CHANNELS) return "…";
  var n = 0;
  for (var i = 0; i < CHANNELS.categories.length; i++) {
    var c = CHANNELS.categories[i];
    if (catIds.indexOf(c.id) < 0) continue;
    for (var j = 0; j < c.channels.length; j++) {
      if (c.channels[j].status === "ok") n++;
    }
  }
  return n;
}

var SECTIONS = SECTIONS_ALL;

function countIn(cats) {
  return RESOURCES.filter(function (r) { return cats.indexOf(r.category) >= 0; }).length;
}

let route = { home: true, sec: "", sub: "" };
let activeGuide = null;
let lastResView = "";

function parseRoute() {
  var h = String(location.hash || "").replace(/^#\/?/, "");
  if (!h) return { home: true, sec: "", sub: "" };
  var parts = h.split("/");
  var sec = parts[0] || "";
  var found = null;
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === sec) found = SECTIONS[i];
  if (!found) return { home: true, sec: "", sub: "" };
  var sub = parts[1] || "";
  var ok = false;
  for (var j = 0; j < found.subs.length; j++) if (found.subs[j].id === sub) ok = true;
  if (!ok) sub = found.subs[0].id;
  return { home: false, sec: sec, sub: sub };
}

function go(sec, sub) {
  location.hash = sec ? ("#/" + sec + (sub ? "/" + sub : "")) : "#/";
}

const byTitle = new Map();
function rebuildTitleIndex() {
  byTitle.clear();
  for (const r of RESOURCES) byTitle.set(r.name, r);
}

function currentSection() {
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === route.sec) return SECTIONS[i];
  return null;
}

function renderModebar() {
  modebar.innerHTML = "";

  // 一级：首页 / 权益服务 / 学习资源
  var HOME = { id: "", label: "首页" };
  var tops = [HOME].concat(SECTIONS.filter(function (x) { return x.nav !== false; }));
  for (var i = 0; i < tops.length; i++) {
    (function (s) {
      var b = document.createElement("button");
      b.type = "button";
      var isActive = (s.id === "" && route.home) || (s.id !== "" && route.sec === s.id);
      b.className = "mode-btn" + (isActive ? " active" : "");
      b.textContent = s.label;
      b.addEventListener("click", function () { go(s.id, ""); });
      modebar.appendChild(b);
    })(tops[i]);
  }
}

function applyMode() {
  route = parseRoute();

  var isRes = !!RESOURCE_VIEWS[route.sub];
  viewHome.hidden = !route.home;
  viewRes.hidden = !isRes;
  viewCha.hidden = route.sub !== "channels";
  for (var qk in QUICK_PAGES) {
    QUICK_PAGES[qk].el.hidden = route.sub !== qk;
  }
  // 搜索与筛选栏只对资源类视图有意义
  if (toolbar) toolbar.hidden = !isRes;

  // 在不同资源视图之间切换时，重置分类/子分类筛选，否则会带着上一个视图的条件
  if (isRes && lastResView !== route.sub) {
    activeCategory = "全部";
    activeSub = "";
  }
  lastResView = isRes ? route.sub : "";

  renderModebar();
  renderIconGrid();

  if (route.home) {
    renderHome();
  }
  if (isRes) { renderChips(); render(); }
  if (route.sub === "channels") renderRights();
  if (isQuick(route.sub)) renderQuick(route.sub);

  window.scrollTo({ top: 0, behavior: "auto" });
}

/* 渠道卡片上的地址显示。
   卡片底部的 chip 只有 190px，装不下完整 URL —— 直接显示全地址会被截成
   「https://young.ustc.edu.cn/...」，看起来跟首页一模一样，看不出是哪个具体页面；
   做智能缩略也仍会被二次截断。所以 link 类型只显示域名：
   去处由卡片标题与说明交代，完整地址保留在 href 与 title（悬停可见）里。 */
function hostOf(u) {
  var m = String(u == null ? "" : u).match(/^https?:\/\/([^\/]+)/);
  if (!m) return String(u == null ? "" : u);
  return m[1].replace(/^www\./, "");
}

/* 从试卷的 y 字段里取出年份数字。
   数据里 y 有四种形态：「2025」「2025春」「2017/2018/2019/2025」「2001-2020」「年份未知」。
   排序只认前四位，否则「2025春」会被当成"没有年份"，2026 年的卷子会沉到列表底部 —— 实测踩过。 */
/* 当前资源视图允许出现的分类 */
function currentCats() {
  return RESOURCE_VIEWS[route.sub] || CATEGORIES.slice(1);
}

function countRefs(g) {

/* ---------- 技能自查表（勾选存 localStorage，不上传） ---------- */

/* ===== 资源数据加载 =====
   以 resources.json 为准；加载成功则原地替换内嵌数据并重绘。
   file:// 打开（fetch 不可用）或网络异常时静默降级，继续用内嵌数据，
   因此页面在任何情况下都有内容可显示。
   注意：指南与技能表目前只用内嵌数据（它们不常变，内嵌可保证离线可用）。

   ⚠️ 这里有一道必要的防护：远端 resources.json 可能被 CDN 或浏览器缓存成【旧版本】。
   旧数据的条目与当前内嵌数据对不上，如果直接覆盖索引，就会出现
   「点任何卡片都打开同一条 / 详情标题空白」这类诡异现象。
   因此覆盖前必须比对：远端数据是否覆盖了内嵌数据的每一条。
   若不覆盖，说明它已过期 —— 保留内嵌数据（卡片本来就用它渲染，天然一致）。 */
function coversEmbedded(list) {
  const remote = new Set();
  for (const r of list) if (r && r.title) remote.add(r.title);
  const embeddedNames = [];
  for (const r of RESOURCES) embeddedNames.push(r.name);
  const missing = [];
  for (const n of embeddedNames) if (!remote.has(n)) missing.push(n);
  return { ok: missing.length === 0, missing: missing };
}

/* 字段名归一化 —— 这是一处曾经导致线上事故的缺陷，务必保留。
   原因：resources.json 里的字段名是 title（规范要求），而内嵌数据与渲染代码用的是 name。
   两者只有在"fetch 成功、用远端数据覆盖内存"之后才会同时出现，
   于是 render() 里的 r.name 变成 undefined，卡片标题直接显示成 "undefined"。
   这里统一补齐两种字段名，使两套数据无论以何种顺序进入都不会再出问题。 */
function normalizeRecord(r) {
  if (!r) return r;
  const o = Object.assign({}, r);
  if (o.name === undefined) o.name = o.title;
  if (o.title === undefined) o.title = o.name;
  if (typeof o.free !== "boolean") o.free = !!o.free;
  if (!o.category) o.category = "未分类";
  if (!Array.isArray(o.tags)) o.tags = [];
  return o;
}

function applyResources(list) {
  if (!Array.isArray(list) || !list.length) return false;
  const cover = coversEmbedded(list);
  if (!cover.ok) {
    // 远端数据比页面旧，不足以覆盖当前卡片 —— 宁可不用它，也不能让索引错位。
    console.warn("[权益广场] resources.json 版本落后于页面，已忽略。缺少 " +
      cover.missing.length + " 条，例如：" + cover.missing.slice(0, 3).join("、"));
    return false;
  }
  RESOURCES.length = 0;
  for (const r of list) RESOURCES.push(normalizeRecord(r));
  rebuildTitleIndex();
  updateStats();
  refreshIconNums();
  renderSubchips();
  render();
  return true;
}

function loadResources() {
  if (typeof fetch !== "function" || location.protocol === "file:") return;
  // cache: "no-store" —— resources.json 与 index.html 是分开缓存的，
  // 一旦出现"旧数据 + 新页面"的错配，就会引发卡片标题异常、索引错位等诡异问题。
  // 这个文件很小（百余 KB），每次重新取最稳妥。
  fetch("resources.json", { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function (doc) { applyResources(doc && doc.resources); })
    .catch(function () { /* 静默降级到内嵌数据 */ });
}

// 内嵌数据也归一化一次，确保它与远端数据在任何使用顺序下都带齐 name/title
for (let i = 0; i < RESOURCES.length; i++) RESOURCES[i] = normalizeRecord(RESOURCES[i]);

rebuildTitleIndex();

/* ===================================================================
   权益反馈
   目的：把校内各种反馈渠道汇总成一张清单，同学遇到问题知道该找谁。
   数据在 channels.json，便于非技术人员后续维护（改标题/换链接不用碰代码）。
   每条渠道带 status：ok（已实测可访问）/ todo（待补充链接）。

let CHANNELS = null;
let chLoaded = false;

function loadChannels() {
  if (chLoaded) return;
  chLoaded = true;
  if (typeof fetch !== "function" || location.protocol === "file:") {
    renderRightsError("本地打开（file://）时无法载入渠道数据，请通过网站访问。");
    return;
  }
  fetch("channels.json", { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function (doc) {
      // 统计"可用"条数，用于模式按钮上的数字
      let ok = 0;
      (doc.categories || []).forEach(function (c) {
        (c.channels || []).forEach(function (x) { if (x.status === "ok") ok++; });
      });
      doc.count = ok;
      var totalCh = 0;
      (doc.categories || []).forEach(function (c) { totalCh += (c.channels || []).length; });
      doc.total = totalCh;
      CHANNELS = doc;
      setStat("chanStat", ok);
      refreshIconNums();
      renderModebar();
      // 按当前所在视图重渲染 —— 精简页和完整页是两个容器，漏掉任何一个都会停在「正在载入…」
      if (route.sub === "channels") renderRights();
      if (isQuick(route.sub)) renderQuick(route.sub);
    })
    .catch(function (e) {
      console.error("[权益广场] 权益渠道加载失败:", e);
      renderRightsError("渠道数据加载失败，请刷新重试。");
    });
}

function renderRightsError(msg) {
  // 精简页与完整页是两个容器，错误要写在当前正看的那个
  /* 错误提示要写在当前正看的那个容器里 */
  var host = isQuick(route.sub) ? QUICK_PAGES[route.sub].el : viewCha;
  host.innerHTML = "";
  const p = document.createElement("p");
  p.className = "empty";
  p.textContent = msg;
  host.appendChild(p);
}

function renderChannelsInto(host, catFilter, introText) {
  if (!CHANNELS) {
    if (!chLoaded) loadChannels();
    if (!host.querySelector(".rt-loading")) {
      host.innerHTML = "";
      const p = document.createElement("p");
      p.className = "empty rt-loading";
      p.textContent = "正在载入反馈渠道…";
      host.appendChild(p);
    }
    return;
  }
  if (host.querySelector(".rt-intro")) return;   // 已渲染过，不重复构建

  host.innerHTML = "";

  // 顶部说明：传 null 表示这一页不要说明框
  if (introText !== null) {
    const intro = document.createElement("div");
    intro.className = "rt-intro";
    intro.innerHTML = introText || INTRO_FULL;
    host.appendChild(intro);
  }

  // 按分类渲染
  for (const cat of CHANNELS.categories || []) {
    // 精简页只渲染指定的几组
    if (catFilter && catFilter.indexOf(cat.id) < 0) continue;
    const box = document.createElement("section");
    box.className = "rt-cat";

    const h = document.createElement("h3");
    h.textContent = cat.name;
    if (cat.desc) {
      const d = document.createElement("span");
      d.className = "rt-cat-desc";
      d.textContent = cat.desc;
      h.appendChild(d);
    }
    box.appendChild(h);

    const list = document.createElement("div");
    list.className = "rt-list";
    for (const ch of cat.channels || []) {
      const item = document.createElement("div");
      item.className = "rt-item" + (ch.status === "ok" ? "" : " todo");

      const n = document.createElement("div");
      n.className = "rt-name";
      n.textContent = ch.name;
      item.appendChild(n);

      const d = document.createElement("div");
      d.className = "rt-desc";
      d.textContent = ch.desc || "";
      item.appendChild(d);

      const foot = document.createElement("div");
      foot.className = "rt-foot";

      // 渠道有多种形态：网页链接 / QQ 号 / 电话 / 邮箱 / 公众号 / 操作说明。
      // 统一用 kind 区分，因为"点一下就跳转"只对 link 成立，QQ 号要能复制、
      // 电话要能拨号、公众号只能告诉同学去微信搜。
      var kind = ch.kind || "link";
      var val = ch.value || ch.url || "";
      var usable = ch.status === "ok" && (kind === "guide" || val);

      if (usable) {
        if (val && kind !== "guide") {
          var v = document.createElement("span");
          v.className = "rt-val";
          // 链接类只显示域名；邮箱/QQ/电话显示原值（那些本身就是完整信息）
          v.textContent = kind === "link" ? hostOf(val) : val;
          v.title = val;                   // 悬停可见完整地址
          foot.appendChild(v);
        }
        var sp0 = document.createElement("span");
        sp0.className = "rt-flex";
        foot.appendChild(sp0);

        if (kind === "link") {
          var a = document.createElement("a");
          a.className = "rt-go";
          a.href = val;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "去反馈";
          a.title = val;
          foot.appendChild(a);
        } else if (kind === "phone") {
          var tel = document.createElement("a");
          tel.className = "rt-go";
          tel.href = "tel:" + String(val).replace(/[^0-9+]/g, "");
          tel.textContent = "拨号";
          foot.appendChild(tel);
        } else if (kind === "email") {
          var ml = document.createElement("a");
          ml.className = "rt-go";
          ml.href = "mailto:" + val;
          ml.textContent = "发邮件";
          foot.appendChild(ml);
        } else if (kind === "qq") {
          var cp = document.createElement("button");
          cp.type = "button";
          cp.className = "rt-go";
          cp.textContent = "复制 QQ 号";
          cp.addEventListener("click", function (ev) {
            ev.preventDefault();
            var txt = String(val);
            if (typeof navigator !== "undefined" && navigator.clipboard) {
              navigator.clipboard.writeText(txt).then(function () { cp.textContent = "已复制"; });
            } else {
              cp.textContent = "已复制";
            }
          });
          foot.appendChild(cp);
        } else if (kind === "wechat") {
          var wx = document.createElement("span");
          wx.className = "rt-wx";
          wx.textContent = "微信里搜索关注";
          foot.appendChild(wx);
        }
      } else {
        var w = document.createElement("span");
        w.className = "rt-wait";
        w.textContent = val ? "暂不可用" : "待补充链接";
        w.title = "确认后会补上";
        foot.appendChild(w);
        var sp1 = document.createElement("span");
        sp1.className = "rt-flex";
        foot.appendChild(sp1);
      }
      item.appendChild(foot);
      list.appendChild(item);
    }
    box.appendChild(list);
    host.appendChild(box);
  }
}

/* 完整渠道页（9 组） */
function renderRights() { renderChannelsInto(viewCha, null, INTRO_FULL); }

/* 其余几个快捷页（学生权益反馈渠道 / 校园报修 / 部门直拨电话 / 教学服务）
   都由 renderQuick(sub) 按 QUICK_PAGES 表统一渲染，不再逐个写包装函数。 */

// 路由：hash 变化就重新渲染（支持浏览器前进/后退与直接打开深链接）
window.addEventListener("hashchange", applyMode);
renderModebar();
applyMode();
loadResources();

/* 首屏之后再拉三个小数据文件：channels.json（渠道清单）、news.json（工作动态）、
   issues.json（典型问题处理）。推迟 400ms，避免和首屏资源列表抢带宽；
   任何一个失败都静默降级到占位文案，不影响其余部分。 */
setTimeout(function () {
  loadChannels();
  loadNews();
  loadIssues();
}, 400);

</script>
</body>
